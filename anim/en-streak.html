<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends «STREAK ALERT» (owner, 2026-11-03): a run nobody talks about, counted up, then each result of it. */
#ghost{position:absolute;top:300px;left:50%;width:1000px;height:1000px;margin-left:-500px;object-fit:contain;opacity:.1}
#hk{top:150px;width:100%;font:400 150px/0.9 B;letter-spacing:3px;transform:skewX(-8deg);text-shadow:0 8px 40px rgba(0,0,0,.6)}
#cr{top:330px;left:50%;width:260px;height:260px;margin-left:-130px;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
#tm{top:600px;width:100%;font:400 80px/1 B;letter-spacing:2px}
#n{top:690px;width:100%;font:400 420px/0.9 B;color:#ffd21f;text-shadow:0 0 60px rgba(255,210,31,.5)}
#lb{top:1060px;width:100%;font:700 52px O;letter-spacing:4px}
#rs{top:1160px;left:60px;right:60px;display:flex;flex-direction:column;gap:12px}
.r{display:flex;align-items:center;gap:20px;height:66px;padding:0 24px;border-radius:18px;background:rgba(var(--bx),.88);border-left:10px solid #16a34a;font:500 38px O;opacity:0}
.r b{font:400 50px B;color:#ffd21f;width:120px}.r span{flex:1}.r small{font:700 24px O;color:var(--kc);letter-spacing:2px}
#cta{bottom:56px}
</style></head><body><div class="bg"></div><div class="streak"></div><img id="ghost"><div class="logo">FB<i>LEGENDS</i></div>
<div class="abs c" id="hk">STREAK <span class="y">ALERT</span> 🔥</div><img class="abs" id="cr"><div class="abs c" id="tm"></div><div class="abs c" id="n">0</div><div class="abs c" id="lb"></div>
<div class="abs" id="rs"></div><div class="cta" id="cta"></div>
<script src="lib.js"></script><script src="en-lib.js"></script><script>
const D = window.DATA;
if (D.logo) { $('cr').src = D.logo; $('ghost').src = D.logo; } else { $('cr').remove(); $('ghost').remove(); }
$('tm').textContent = D.team; $('lb').textContent = D.label || 'WINS IN A ROW';
const R = (D.results || []).slice(-6);
$('rs').innerHTML = R.map((x) => `<div class="r"><b>${x.score}</b><span>${x.vs}</span><small>${x.comp || ''}</small></div>`).join('');
$('cta').textContent = D.cta || 'CAN ANYONE STOP THEM? 👇';
const rows = [...document.querySelectorAll('.r')];
window.TOTAL = 10;
window.draw = (t) => {
  // The number is there at t=0 and counts up to its value in the first second.
  $('n').textContent = Math.round(D.n * ease(t / 1));
  $('n').style.transform = `scale(${t < 1 ? 1 : 1 + .05 * Math.sin((t - 1) * 4)})`;
  if (document.getElementById('ghost')) $('ghost').style.transform = `rotate(${-5 + 10 * cl(t / 10)}deg)`;
  rows.forEach((r, i) => { const a = ease((t - 1.6 - i * .45) / .35); r.style.opacity = a; r.style.transform = `translateX(${(1 - a) * -80}px)`; });
  const c = ease((t - 1.8 - rows.length * .45) / .5); $('cta').style.opacity = c;
};
// The cover (owner, 2026-11-03: «كل فيديو حطله غلاف رايق»): the first frame, which Facebook shows in the grid, is the reel at its
// fullest moment; a quiz's cover never shows its answer.
window.POSTER = window.TOTAL - 1;
progBar();
draw(0);
</script></body></html>
