<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends «ROUND IN REVIEW» (owner, 2026-11-04: «فيديو طويل و مشوق ... بملخص كل جولة ... دوري محلي او دوري ابطال او
   امم اوروبية ... الهوك و شغل الساسبينس»), 1.5-2 minutes upright: the hook (the round's numbers, the result of the round
   saved for last), every match one at a time («? - ?», the reveal, the scorers, a line), the star of the round, the
   numbers of the round, the table now, then every result and the question. One spoken line a beat (DATA.beats). */
#lg{top:62px;right:44px;font:700 32px O;letter-spacing:3px;text-transform:uppercase;text-align:right;z-index:20}
.sc{position:absolute;inset:0;opacity:0}
#hk .t{position:absolute;top:300px;width:100%;text-align:center;font:400 190px/0.86 B;letter-spacing:3px;transform:skewX(-8deg);text-shadow:0 8px 40px rgba(0,0,0,.6)}
#hk .tz{position:absolute;top:760px;left:70px;right:70px;display:flex;flex-direction:column;gap:26px}
#hk .tz div{height:150px;border-radius:28px;background:rgba(var(--bx),.9);border:3px solid var(--kc);display:flex;align-items:center;justify-content:center;font:400 96px B;letter-spacing:3px;opacity:0}
#hk .tz div b{color:#ffd21f;font-weight:400}
#hk .sv{position:absolute;top:1400px;left:60px;right:60px;text-align:center;font:700 46px/1.25 O;color:#ffd21f;opacity:0}
#mt .k{position:absolute;top:200px;width:100%;text-align:center;font:700 34px O;letter-spacing:6px;color:var(--kc)}
#mt .tg{position:absolute;top:262px;left:50%;transform:translateX(-50%);color:var(--dk);font:400 54px B;letter-spacing:3px;padding:6px 28px;border-radius:14px;white-space:nowrap}
#mt .tg.SHOCK{background:#ff3b5c;color:#fff}#mt .tg.DERBY{background:#a855f7;color:#fff}#mt .tg.THRILLER{background:#f97316;color:#fff}#mt .tg.ROUND{background:#ffd21f}#mt .tg.GIANTS{background:var(--kc)}
.sd{position:absolute;top:420px;width:470px;text-align:center}.sd img{width:300px;height:300px;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}.sd b{display:block;font:400 76px/1 B;letter-spacing:2px;margin-top:18px}
#h{left:20px}#a{right:20px}
#box{position:absolute;top:960px;left:50%;width:720px;margin-left:-360px;height:330px;border-radius:36px;background:rgba(var(--bx),.92);border:6px solid var(--kc);display:flex;align-items:center;justify-content:center;font:400 290px/1 B;letter-spacing:14px}
#box .w{color:#ffd21f}
#sc{position:absolute;top:1475px;left:60px;right:60px;text-align:center;font:500 38px/1.3 O;color:#c9d0f5}#sc b{color:#fff}
#ln{position:absolute;top:1360px;left:60px;right:60px;text-align:center;font:400 92px/0.95 B;letter-spacing:2px;transform:skewX(-6deg)}
#gs{position:absolute;top:330px;left:0;right:0;text-align:center;font:700 34px O;letter-spacing:4px;color:#fff}
#st .k,#nb .k,#tb .k{position:absolute;top:200px;width:100%;text-align:center;font:400 120px/0.9 B;letter-spacing:3px;transform:skewX(-6deg)}
#st img{position:absolute;top:520px;left:50%;width:380px;height:380px;margin-left:-190px;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
#st .nm{position:absolute;top:960px;width:100%;text-align:center;font:400 130px/1 B;letter-spacing:3px}
#st .tm{position:absolute;top:1100px;width:100%;text-align:center;font:700 44px O;letter-spacing:4px;color:var(--kc)}
#st .bl{position:absolute;top:1220px;width:100%;text-align:center;font:400 150px/1 B;color:#ffd21f}
#st .vs{position:absolute;top:1400px;width:100%;text-align:center;font:500 40px O;color:#c9d0f5}
#nb .g{position:absolute;top:440px;left:60px;right:60px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
#nb .g div{height:300px;border-radius:30px;background:rgba(var(--bx),.9);border:3px solid rgba(var(--kl),.5);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#nb .g b{font:400 150px/1 B;color:#ffd21f}#nb .g span{font:700 34px O;letter-spacing:3px;color:#c9d0f5;margin-top:8px;text-align:center;padding:0 10px}
#nb .bw{position:absolute;top:1130px;left:60px;right:60px;height:250px;border-radius:30px;background:rgba(var(--bx),.9);border:3px solid #ffd21f;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#nb .bw span{font:700 34px O;letter-spacing:4px;color:#ffd21f}#nb .bw b{font:400 96px/1.1 B;letter-spacing:2px;text-align:center}
#tb .l{position:absolute;top:420px;left:40px;right:40px}
#tb .r,#ou .r{display:flex;align-items:center;border-radius:20px;background:rgba(var(--bx),.88);border:2px solid rgba(var(--kl),.3);gap:12px}
#tb .r{height:var(--th);margin-bottom:12px;padding:0 22px;font:700 44px O}
#tb .r .n{width:70px;font:400 60px B;color:var(--sm)}#tb .r img{width:70px;height:70px;object-fit:contain}#tb .r .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tb .r .mv{width:80px;text-align:center;font:700 30px O}.mv.u{color:#22e584}.mv.d{color:#ff3b5c}.mv.s{color:#6b7bb0}#tb .r .p{width:110px;text-align:center;font:400 70px B;color:#ffd21f}
#tb .r.lead{background:linear-gradient(90deg,#b8860b,var(--b2) 70%);border-color:#ffd21f}
#ou .t{position:absolute;top:150px;width:100%;text-align:center;font:400 110px/0.9 B;letter-spacing:2px}
#ou .l{position:absolute;top:330px;left:40px;right:40px}
#ou .r{height:var(--oh);margin-bottom:var(--og);padding:0 16px}
#ou .r img{width:var(--oi);height:var(--oi);object-fit:contain}#ou .r span{flex:1;font:700 var(--of) O;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ou .r .rt{text-align:right}#ou .r b{width:150px;text-align:center;font:400 var(--os) B;color:#ffd21f}
#cta{bottom:50px;opacity:0}

/* v2 (owner, 2026-11-04: «غير تصميمه»): the round's crests behind the hook, the numbers as three counters, progress dots,
   a scoreboard with FT, a goal timeline (each goal dropped at its minute), the results split in one bar. */
#mos{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:34px;padding:120px 30px;opacity:.13;filter:grayscale(.2)}
#mos img{width:150px;height:150px;object-fit:contain}
#hk .tz{flex-direction:row!important;top:820px!important;gap:22px!important}
#hk .tz div{flex:1;height:300px!important;flex-direction:column;font:700 34px O!important;letter-spacing:3px!important;color:#c9d6ff;border-radius:34px!important}
#hk .tz div b{display:block;font:400 150px/1 B;margin:0 0 6px!important;color:#ffd21f}
#hk .sv{top:1250px!important;left:50%!important;right:auto!important;transform:translateX(-50%);white-space:nowrap;background:#ffd21f;color:var(--dk)!important;padding:14px 34px;border-radius:18px;font:400 58px B!important;letter-spacing:2px}
#dots{position:absolute;top:150px;left:0;right:0;display:flex;justify-content:center;gap:14px}
#dots i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(var(--kl),.5)}
#dots i.d{background:var(--kc)}#dots i.c{background:#ffd21f;border-color:#ffd21f;transform:scale(1.35)}
#mt .k{top:205px!important}#mt .tg{top:258px!important}
.sd{top:400px!important}.sd img{width:260px!important;height:260px!important}.sd b{font-size:68px!important}
#box{top:820px!important;height:290px!important;width:660px!important;margin-left:-330px!important;font-size:250px!important}
#box:after{content:'FT';position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--kc);color:var(--dk);font:700 30px O;letter-spacing:3px;padding:4px 18px;border-radius:10px}
#tl{position:absolute;top:1190px;left:70px;right:70px;height:150px}
#tl .bar{position:absolute;top:70px;left:0;right:0;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
#tl .ht{position:absolute;top:58px;left:50%;width:4px;height:34px;background:rgba(255,255,255,.4)}
#tl .lb{position:absolute;top:96px;font:700 24px O;color:#8fa2d8}
#tl .g{position:absolute;top:0;width:0;text-align:center}
#tl .g b{position:absolute;left:-26px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
#tl .g.h b{top:6px;background:#ffd21f}#tl .g.a b{top:6px;background:var(--kc)}
#tl .g span{position:absolute;left:-70px;width:140px;top:104px;font:700 24px O;color:#fff;white-space:nowrap;text-align:center}
#tl .g.a span{top:-36px}
#ln{top:1395px!important}#sc{top:1500px!important}#gs{top:1720px!important;color:var(--sm)}
#nb .sp{position:absolute;top:1430px;left:60px;right:60px;height:90px;border-radius:20px;overflow:hidden;display:flex;opacity:0}
#nb .sp div{display:flex;align-items:center;justify-content:center;font:400 46px B;letter-spacing:2px;color:var(--dk)}
#nb .spl{position:absolute;top:1535px;left:60px;right:60px;display:flex;justify-content:space-between;font:700 28px O;letter-spacing:3px;color:#c9d6ff;opacity:0}
</style></head><body><div class="bg"></div><div class="streak"></div><div class="logo">FB<i>LEGENDS</i></div><div class="abs" id="lg"></div>
<div class="sc" id="hk"><div id="mos"></div><div class="t"></div><div class="tz"></div><div class="sv"></div></div>
<div class="sc" id="mt"><div id="dots"></div><div class="k"></div><div class="tg"></div><div class="sd" id="h"></div><div class="sd" id="a"></div><div id="box"></div><div id="tl"></div><div id="gs"></div><div id="ln"></div><div id="sc"></div></div>
<div class="sc" id="st"><div class="k">STAR OF <span class="y">THE ROUND</span></div><img><div class="nm"></div><div class="tm"></div><div class="bl"></div><div class="vs"></div></div>
<div class="sc" id="nb"><div class="k">THE ROUND IN <span class="y">NUMBERS</span></div><div class="g"></div><div class="bw"><span>BIGGEST WIN</span><b></b></div><div class="sp"></div><div class="spl"></div></div>
<div class="sc" id="tb"><div class="k"></div><div class="l"></div></div>
<div class="sc" id="ou"><div class="t"></div><div class="l"></div></div><div class="cta" id="cta"></div>
<script src="lib.js"></script><script src="en-lib.js"></script><script>
const D = window.DATA, M = D.rows || [], n = M.length, q = (s, sel) => document.querySelector(`#${s} ${sel}`);
const crest = (u, w) => (u ? `<img src="${u}">` : `<i style="width:${w}px"></i>`);
$('lg').textContent = D.league || '';
// The order of the beats: the hook, each match, then the extras the server sent (star, numbers, table), then all.
// One match told on its own (DATA.single, a record night) has no counter, no dots and no list of all results (DATA.noAll).
const SEQ = ['hook', ...M.map((_, i) => 'm' + i), ...(D.star ? ['star'] : []), ...(D.nums ? ['nums'] : []), ...(D.table?.length ? ['table'] : []), ...(D.noAll ? [] : ['all'])], LAST = SEQ[SEQ.length - 1];
if (D.numsHead) q('nb', '.k').innerHTML = D.numsHead;
if (D.single) ['#mt .k', '#dots', '#gs'].forEach((x) => { document.querySelector(x).style.display = 'none'; });
q('hk', '.t').innerHTML = `${D.h1 || 'ROUND'}<br><span class="y">${D.h2 || ''}</span>`;
// A long name (CHAMPIONS LEAGUE) took two lines and ran into the first number (owner's screenshot, 2026-11-04): the
// title shrinks until it ends above the numbers.
{ const t = q('hk', '.t'); let f = 190; while (t.offsetTop + t.offsetHeight > 780 && f > 90) { f -= 8; t.style.fontSize = f + 'px'; } }
q('hk', '.tz').innerHTML = (D.teasers || []).slice(0, 3).map(([v, w]) => `<div><b>${v}</b>${w}</div>`).join('');
q('hk', '.sv').textContent = D.save || 'THE RESULT OF THE ROUND IS SAVED FOR LAST 👀';
$('mos').innerHTML = [...new Set((D.all || M).flatMap((m) => [m.homeLogo, m.awayLogo]).filter(Boolean))].slice(0, 36).map((u) => `<img src="${u}">`).join('');
$('dots').innerHTML = M.map(() => '<i></i>').join('');
if (D.star) { const s = D.star; q('st', 'img').src = s.logo || ''; if (!s.logo) q('st', 'img').style.display = 'none'; q('st', '.nm').textContent = s.name; q('st', '.tm').textContent = s.team; q('st', '.bl').textContent = '⚽'.repeat(Math.min(s.g, 5)); q('st', '.vs').textContent = s.vs || ''; }
if (D.nums?.split) { const [h, d, a] = D.nums.split, t = h + d + a || 1;
  q('nb', '.sp').innerHTML = [[h, '#ffd21f'], [d, 'var(--sm)'], [a, 'var(--kc)']].filter(([v]) => v).map(([v, c]) => `<div style="flex:${v};background:${c}">${v}</div>`).join('');
  q('nb', '.spl').innerHTML = `<span>HOME WINS</span><span>DRAWS</span><span>AWAY WINS</span>`; }
if (D.nums) { const N = D.nums; q('nb', '.g').innerHTML = N.tiles.map(([v, w]) => `<div><b data-v="${v}">${v}</b><span>${w}</span></div>`).join(''); q('nb', '.bw b').textContent = N.big || ''; if (!N.big) q('nb', '.bw').style.display = 'none'; }
if (D.table?.length) {
  const T = D.table, th = T.length > 6 ? 120 : 150; document.documentElement.style.setProperty('--th', th + 'px');
  q('tb', '.k').innerHTML = D.tableHead || 'THE TABLE <span class="y">NOW</span>';
  q('tb', '.l').innerHTML = T.map((r, i) => `<div class="r${i === 0 ? ' lead' : ''}"><span class="n">${r.rank}</span>${crest(r.logo, 70)}<span class="t">${r.name}</span><span class="mv ${r.mv > 0 ? 'u' : r.mv < 0 ? 'd' : 's'}">${r.mv > 0 ? '▲' + r.mv : r.mv < 0 ? '▼' + -r.mv : r.mv === 0 ? '–' : ''}</span><span class="p">${r.pts}</span></div>`).join('');
}
const ALL = (D.all || M).slice(0, 18), na = ALL.length, oh = na > 12 ? 70 : na > 9 ? 100 : 118;
document.documentElement.style.cssText += `;--oh:${oh}px;--og:${na > 12 ? 7 : 12}px;--oi:${na > 12 ? 44 : 62}px;--of:${na > 12 ? 28 : 34}px;--os:${na > 12 ? 52 : 68}px`;
q('ou', '.t').innerHTML = `ALL <span class="y">${D.h3 || 'THE RESULTS'}</span>`;
q('ou', '.l').innerHTML = ALL.map((m) => `<div class="r">${crest(m.homeLogo, 44)}<span>${m.home}</span><b>${m.hs}-${m.as}</b><span class="rt">${m.away}</span>${crest(m.awayLogo, 44)}</div>`).join('');
$('cta').textContent = D.cta || 'WHAT WAS THE RESULT OF THE ROUND? 👇';
const mins = D.minBeats || SEQ.map((s) => (s === 'hook' ? 5 : s[0] === 'm' ? 6 : s === 'all' ? 6.5 : 6)), B = D.beats || (() => { let t = 0; return mins.map((m) => { const b = [t, m]; t += m; return b; }); })();
window.TOTAL = B[B.length - 1][0] + B[B.length - 1][1];
let cur = -2;
const setMatch = (i) => {
  const m = M[i]; q('mt', '.k').textContent = `MATCH ${i + 1} OF ${n}`;
  const tg = q('mt', '.tg'); tg.className = 'tg ' + (m.tag || ''); tg.textContent = m.tag === 'ROUND' ? 'RESULT OF THE ROUND' : m.tag === 'SHOCK' ? 'SHOCK RESULT 😱' : m.tag === 'GIANTS' ? 'BIG GAME' : m.tag || ''; tg.style.display = m.tag ? 'block' : 'none';
  $('h').innerHTML = `${m.homeLogo ? `<img src="${m.homeLogo}">` : ''}<b>${m.home}</b>`; $('a').innerHTML = `${m.awayLogo ? `<img src="${m.awayLogo}">` : ''}<b>${m.away}</b>`;
  $('ln').innerHTML = m.head || '';
  // The goals at their minutes (only when the scorers add up to the score).
  const tl = (m.tl || []).length === m.hs + m.as ? m.tl : [], mx = Math.max(90, ...tl.map((g) => g.m));
  $('tl').innerHTML = tl.length ? `<div class="bar"></div><div class="ht"></div>`
    + (() => { const lastAt = { h: -99, a: -99 }, lvl = { h: 0, a: 0 };
      // Goals close together on one side: their names on alternate lines, never on top of each other.
      return tl.map((g) => { lvl[g.s] = g.m - lastAt[g.s] < 16 ? 1 - lvl[g.s] : 0; lastAt[g.s] = g.m; const dy = lvl[g.s] * (g.s === 'h' ? 32 : -32);
        return `<div class="g ${g.s}" style="left:${(g.m / mx) * 100}%"><b>⚽</b><span style="margin-top:${dy}px">${g.m}' ${g.n}${g.og ? ' (OG)' : g.pen ? ' (P)' : ''}</span></div>`; }).join(''); })() : '';
  document.querySelectorAll('#dots i').forEach((d, j) => { d.className = j < i ? 'd' : j === i ? 'c' : ''; });
  $('sc').innerHTML = m.sc ? `⚽ ${[m.sc[0] ? `<b>${m.home}:</b> ${m.sc[0]}` : '', m.sc[1] ? `<b>${m.away}:</b> ${m.sc[1]}` : ''].filter(Boolean).join('<br>')}` : (m.pens ? m.pens : '');
};
const fade = (id, on, u, l) => { $(id).style.opacity = on ? Math.min(ease(u / .25), 1 - ease((u - l + .25) / .25)) : 0; };
window.draw = (t) => {
  const bi = B.findIndex(([s, l]) => t >= s && t < s + l), k = bi < 0 ? B.length - 1 : bi, [s, l] = B[k], u = t - s, seg = SEQ[k] || 'all';
  // The hook: the title, the three numbers one by one, the promise of the end.
  fade('hk', seg === 'hook', u + .25, l);
  if (seg === 'hook') { q('hk', '.t').style.transform = `skewX(-8deg) scale(${1.15 - .15 * ease(u / .5)})`;
    document.querySelectorAll('#hk .tz div').forEach((d, i) => { const a = ease((u - .5 - i * .55) / .3); d.style.opacity = a; d.style.transform = `translateY(${(1 - a) * 80}px)`;
      const b = d.querySelector('b'), v = Number((D.teasers[i] || [])[0]); if (Number.isFinite(v)) b.textContent = Math.round(v * Math.min(1, Math.max(0, (u - .5 - i * .55) / .9))); });
    $('mos').style.transform = `translateY(${-u * 14}px)`;
    q('hk', '.sv').style.transform = `translateX(-50%) scale(${1 + .04 * Math.sin(u * 5)})`;
    q('hk', '.sv').style.opacity = ease((u - .6 - 3 * .55) / .35); }
  const isM = seg[0] === 'm' && seg !== 'all';
  fade('mt', isM, u, l);
  if (isM) {
    const i = Number(seg.slice(1)), m = M[i]; if (cur !== i) { setMatch(i); cur = i; }
    $('h').style.transform = `translateX(${(1 - ease(u / .4)) * -120}px)`; $('a').style.transform = `translateX(${(1 - ease(u / .4)) * 120}px)`;
    // The score hidden for the first part of its beat: the suspense, then the reveal.
    const rv = Math.min(1.6, l * .34), big = m.tag === 'ROUND';
    $('box').innerHTML = /* (owner, 2026-11-10: «بلاش شغل علامة استفهام ... فين البروفشنال»: nothing hidden behind «?») */ `<span class="${m.hs > m.as ? 'w' : ''}">${m.hs}</span><span style="color:var(--kc)">-</span><span class="${m.as > m.hs ? 'w' : ''}">${m.as}</span>`;
    $('box').style.transform = `scale(${u < rv ? 1 + .03 * Math.sin(u * 9) : 1.18 - .18 * back((u - rv) / .45)})`;
    $('box').style.borderColor = u >= rv && big ? '#ffd21f' : 'var(--kc)'; $('box').style.boxShadow = u >= rv ? `0 0 ${big ? 70 : 40}px rgba(${big ? '255,210,31' : '70,215,255'},.55)` : 'none';
    const gs = [...document.querySelectorAll('#tl .g')]; $('tl').style.opacity = ease((u - rv) / .3);
    gs.forEach((g, j) => { const a = ease((u - rv - .25 - j * .32) / .3); g.style.opacity = a; g.style.transform = `translateY(${(1 - a) * -40}px)`; });
    $('ln').style.opacity = ease((u - rv - .2) / .35); $('sc').style.opacity = gs.length ? 0 : ease((u - rv - .5) / .35); $('ln').style.transform = `skewX(-6deg) translateY(${(1 - ease((u - rv - .2) / .35)) * 30}px)`;
    q('mt', '.tg').style.transform = `translateX(-50%) scale(${1 + .05 * Math.sin(u * 5)})`;
    const g = M.slice(0, i).reduce((x, r) => x + r.hs + r.as, 0) + (u >= rv ? m.hs + m.as : 0);
    $('gs').textContent = `⚽ ${g} ${g === 1 ? 'GOAL' : 'GOALS'} SO FAR`;
  }
  fade('st', seg === 'star', u, l);
  if (seg === 'star') { q('st', 'img').style.transform = `scale(${.6 + .4 * back(u / .6)})`; q('st', '.bl').style.opacity = ease((u - .9) / .3); q('st', '.vs').style.opacity = ease((u - 1.3) / .3); }
  fade('nb', seg === 'nums', u, l);
  if (seg === 'nums') {
    document.querySelectorAll('#nb .g div').forEach((d, i) => { const a = ease((u - .3 - i * .5) / .3); d.style.opacity = a; d.style.transform = `scale(${.85 + .15 * a})`;
      const b = d.querySelector('b'), v = b.dataset.v, num = parseFloat(v); if (Number.isFinite(num) && /^[\d.]+$/.test(v)) { const c = Math.min(1, Math.max(0, (u - .3 - i * .5) / .8)); b.textContent = v.includes('.') ? (num * c).toFixed(1) : Math.round(num * c); } });
    q('nb', '.bw').style.opacity = ease((u - 2.6) / .35);
    const sp = ease((u - 3.4) / .4); q('nb', '.sp').style.opacity = sp; q('nb', '.spl').style.opacity = sp; q('nb', '.sp').style.clipPath = `inset(0 ${(1 - sp) * 100}% 0 0)`;
  }
  fade('tb', seg === 'table', u, l);

  const isO = seg === 'all'; $('ou').style.opacity = isO ? ease(u / .35) : 0;
  if (isO) document.querySelectorAll('#ou .r').forEach((r, i) => { const a = ease((u - .1 - i * .06) / .3); r.style.opacity = a; r.style.transform = `translateX(${(1 - a) * (i % 2 ? 80 : -80)}px)`; });
  $('cta').style.opacity = seg === LAST ? ease((u - (isO ? .9 : 3.2)) / .4) : 0;
};
