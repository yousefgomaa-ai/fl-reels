<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* «نهاية المباراة» moving (owner, 2026-11-03): the clock runs to 90 and each goal lands at its minute, then the numbers. */
#sb{top:220px;left:40px;right:40px;display:flex;align-items:center;justify-content:space-between}.tm{width:330px;display:flex;flex-direction:column;align-items:center;gap:12px}.tm img{width:210px;height:210px;object-fit:contain}.tm b{font-size:44px;font-weight:900;text-align:center;line-height:1.15}
#sc{display:flex;gap:26px;direction:ltr;font:900 170px Arial;align-items:center}#sc i{font-style:normal;color:#22e9ff;font-size:120px}
#pens{top:600px;width:100%;font-size:34px;font-weight:900;color:#22e9ff}
#tl{top:820px;left:90px;right:90px;height:16px;border-radius:8px;background:#111938}#tl .fill{position:absolute;right:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(270deg,#22e9ff,#ff2f97)}
.gk{position:absolute;top:-18px;width:52px;height:52px;margin-right:-26px;border-radius:50%;background:#fff;border:6px solid #22e9ff}.gk.a{border-color:#ff2f97}
.gl{position:absolute;width:260px;margin-right:-130px;text-align:center;font-weight:900;font-size:27px;line-height:1.2}.gl small{display:block;color:#22e9ff;font-size:25px;direction:ltr}
#st{top:1080px;left:80px;right:80px}#st h3{text-align:center;font-size:42px;color:#22e9ff;margin-bottom:16px}
.sr{margin:24px 0}.sr .lb{display:flex;justify-content:space-between;font-weight:900;font-size:38px;margin-bottom:8px}.sr .lb span{color:#c9d0f5;font-size:32px}
.sr .tr{display:flex;height:22px;gap:8px}.sr .tr div{flex:1;background:#111938;border-radius:11px;overflow:hidden;display:flex}.sr .a{justify-content:flex-start}.sr .b{justify-content:flex-end}.sr i{display:block;height:100%;border-radius:11px}
#motm{bottom:250px;left:80px;right:80px;background:linear-gradient(90deg,#ff2f97,#7a2cff);border-radius:26px;padding:16px;text-align:center;font-weight:900;font-size:38px}
#cta{bottom:160px;width:100%;font-size:50px;font-weight:900}
</style></head><body><div class="bg"></div><div class="grid"></div><div class="bar" style="top:0"></div><div class="brand">FOOTBALL LEGENDS</div><div class="chip" id="chip"></div>
<div class="abs" id="sb"><div class="tm" id="t1"></div><div id="sc"><span id="s2">0</span><i>-</i><span id="s1">0</span></div><div class="tm" id="t2"></div></div>
<div class="abs c" id="pens"></div><div class="abs" id="tl"><div class="fill" id="fill"></div></div><div id="gs"></div>
<div class="abs" id="st"><h3>أرقام المباراة</h3></div><div class="abs" id="motm"></div><div class="abs c" id="cta"></div>
<div class="foot">football-legend.com</div><div class="bar" style="bottom:0"></div>
<script src="lib.js"></script><script>
// The score reads right to left like the site: the home side (right) first.
const D = window.DATA;
$('chip').textContent = D.chip || 'نهاية المباراة'; $('pens').textContent = D.pens || ''; $('cta').textContent = D.cta || 'من رجل المباراة في رأيك؟';
$('t1').innerHTML = `${D.homeLogo ? `<img src="${D.homeLogo}">` : ''}<b>${D.home}</b>`; $('t2').innerHTML = `${D.awayLogo ? `<img src="${D.awayLogo}">` : ''}<b>${D.away}</b>`;
const END = D.end || 90, TL = 900, mm = (m) => { const a = String(m).match(/\d+/g) || [END]; return Math.min(END, Number(a[0]) + (a[1] ? Number(a[1]) / 10 : 0)); };
const G = (D.goals || []).map((g) => ({ ...g, x: mm(g.m) })).sort((a, b) => a.x - b.x);
const lanes = { h: [], a: [] };
const gk = G.map((g) => {
  const d = document.createElement('div'); d.className = 'gk' + (g.s === 'a' ? ' a' : ''); d.style.right = (TL * g.x / END) + 'px'; $('tl').appendChild(d);
  // Labels close to one another take another height.
  const lane = lanes[g.s], k = lane.filter((x) => Math.abs(x - g.x) < 14).length % 2; lane.push(g.x);
  const l = document.createElement('div'); l.className = 'abs gl'; l.style.right = (90 + TL * g.x / END) + 'px';
  l.style.top = (g.s === 'h' ? 730 - k * 74 : 870 + k * 74) + 'px';
  l.innerHTML = `${g.og ? 'هدف عكسي' : g.n}${g.pen ? ' (ج)' : ''}<small>${g.m}'</small>`; document.body.appendChild(l); return [d, l, g];
});
const bars = (D.stats || []).slice(0, D.motm ? 3 : 4).map(([n, a, b]) => {
  const d = document.createElement('div'); d.className = 'sr'; const s = Math.max(1, Number(a) + Number(b));
  d.innerHTML = `<div class="lb"><b>${a}</b><span>${n}</span><b>${b}</b></div><div class="tr"><div class="b"><i style="background:#22e9ff"></i></div><div class="a"><i style="background:#ff2f97"></i></div></div>`;
  $('st').appendChild(d); return [d, a / s, b / s];
});
if (!bars.length) $('st').style.display = 'none';
if (D.motm) $('motm').textContent = `الأعلى تقييمًا: ${D.motm.name} (${D.motm.rating})`; else $('motm').style.display = 'none';
const RUN = 4.2;
window.TOTAL = 12.5;
window.POSTER = 9.6; // the cover frame: score, stats and man of the match
window.draw = (t) => {
  $('chip').dataset.tf = 'translateX(-50%)'; pop($('chip'), t, 0, .5, -30);
  const s = ease((t - .3) / .6); $('t1').style.transform = `translateX(${(1 - s) * 400}px)`; $('t2').style.transform = `translateX(${(1 - s) * -400}px)`; $('t1').style.opacity = $('t2').style.opacity = s; $('sc').style.opacity = ease((t - .8) / .4);
  const clock = END * cl((t - 1.2) / RUN); $('fill').style.width = (clock / END * 100) + '%'; $('tl').style.opacity = ease((t - 1) / .3);
  let h = 0, a = 0;
  gk.forEach(([d, l, g]) => { const on = clock >= g.x, k = t - 1.2 - RUN * g.x / END; d.style.transform = `scale(${on ? Math.max(0, back(k / .4)) : 0})`; l.style.opacity = on ? ease(k / .4) : 0; if (on) g.s === 'h' ? h++ : a++; });
  // The goals counted on the clock, then the final score as the source gives it (an own goal is on the other side already).
  $('s1').textContent = t >= 1.2 + RUN ? D.hs : Math.min(h, D.hs); $('s2').textContent = t >= 1.2 + RUN ? D.as : Math.min(a, D.as);
  pop($('pens'), t, 1.2 + RUN, .4, 20);
  $('st').style.opacity = ease((t - 6) / .4);
  bars.forEach(([d, pa, pb], i) => { const k = ease((t - 6.3 - i * .3) / .8); d.querySelector('.b i').style.width = (k * pa * 100) + '%'; d.querySelector('.a i').style.width = (k * pb * 100) + '%'; d.style.opacity = cl((t - 6.1 - i * .3) / .3); });
  pop($('motm'), t, 8.8, .5, 30); pop($('cta'), t, 10, .5, 30);
};
draw(0);
</script></body></html>
