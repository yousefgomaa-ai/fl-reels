<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends «QUOTE» as a photo post (owner, 2026-11-15: «التصريحات دي تنزل صور مش ريلز»): one 1080x1350 card, the same
   checked quote as en-quote: the speaker's photo, the words, who said it, where, the source and the question. */
html,body{width:1080px!important;height:1350px!important;overflow:hidden}
body{background:#060a1e;color:#fff;font-family:O,Arial}
.ph{position:absolute;left:0;right:0;top:0;height:640px;overflow:hidden;background:#0b1640}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph:after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(6,10,30,.1),rgba(6,10,30,0) 40%,rgba(6,10,30,.85) 82%,#060a1e)}
.ci{display:none;position:absolute;left:50%;top:90px;width:400px;height:400px;margin-left:-200px;border-radius:50%;overflow:hidden;border:8px solid #ffd21f;background:#fff;z-index:1}
.ci img{width:100%;height:100%;object-fit:contain;padding:30px}
.sm .ci{display:block}.sm>img{filter:blur(24px) brightness(.4)}
.lg{position:absolute;left:44px;top:36px;font:400 46px/1 B;letter-spacing:6px;z-index:3;text-shadow:0 2px 10px rgba(0,0,0,.6)}.lg i{font-style:normal;color:#ffd21f;margin-left:10px}
.tg{position:absolute;right:44px;top:30px;background:#ffd21f;color:#060a1e;font:400 46px/1 B;letter-spacing:3px;padding:10px 24px 6px;border-radius:12px;z-index:3}
.cr{position:absolute;left:24px;top:604px;font:500 18px O,Arial;color:rgba(255,255,255,.7);z-index:3}
.mk{position:absolute;left:34px;top:470px;font:400 300px/1 B;color:#ffd21f;z-index:2;text-shadow:0 0 50px rgba(255,210,31,.35)}
.tx{position:absolute;left:60px;right:60px;top:640px;font:400 76px/1.04 B;letter-spacing:1.5px;z-index:2}
.by{position:absolute;left:60px;right:60px;top:0;display:flex;flex-direction:column;gap:6px}
.by b{font:400 60px/1 B;letter-spacing:2px;color:#ffd21f}.by small{font:700 28px/1.3 O;color:#c7d2f5;letter-spacing:1px}
.qq{position:absolute;left:60px;right:60px;bottom:120px;display:flex;align-items:center;gap:26px}
.qq .h{flex:1;font:400 64px/1 B;letter-spacing:2px}.qq .h i{font-style:normal;color:#ffd21f}
.qq .p{width:150px;height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center;font:400 62px/1 B;letter-spacing:3px;border:5px solid #2fe37a;background:rgba(47,227,122,.14)}
.qq .p.n{border-color:#ff3b5c;background:rgba(255,59,92,.14)}
.so{position:absolute;left:60px;right:60px;bottom:52px;font:500 24px O,Arial;color:#8f9cc8}
</style></head><body>
<div class="ph"><img id="p1"><div class="ci"><img id="p2"></div></div>
<div class="lg">FB<i>LEGENDS</i></div><div class="tg" id="tg">QUOTE</div><div class="cr" id="cr"></div>
<div class="mk">“</div><div class="tx" id="tx"></div><div class="by" id="by"><b id="nm"></b><small id="cx"></small></div>
<div class="qq"><div class="h" id="h"></div><div class="p">YES</div><div class="p n">NO</div></div><div class="so" id="so"></div>
<script>
const D = window.DATA || {}, W = D.who || {}, $ = (i) => document.getElementById(i);
$('p1').src = W.photo || ''; $('p1').style.objectPosition = W.pos || '50% 20%'; $('p2').src = W.photo || '';
document.querySelector('.ph').classList.toggle('sm', !!W.small); if (!W.photo) document.querySelector('.ph').style.background = 'radial-gradient(800px 500px at 50% 30%,#1b2f7a,#060a1e)';
$('cr').textContent = W.credit ? '📷 ' + W.credit + ' • Wikimedia Commons' : '';
const q = String(D.quote || ''), len = q.length;
$('tx').textContent = q; $('tx').style.fontSize = (len > 260 ? 50 : len > 200 ? 56 : len > 150 ? 64 : len > 100 ? 72 : 82) + 'px';
$('nm').innerHTML = D.name || ''; $('cx').textContent = [D.about ? 'ON ' + D.about : '', D.context || ''].filter(Boolean).join(' · ');
$('h').innerHTML = D.endH || 'IS HE <i>RIGHT?</i>'; $('so').textContent = D.source ? 'Source: ' + D.source : '';
// the speaker's line right under the quote, however long it is
// the speaker's line right under the quote, however long it is (laid out in draw(), after the fonts are in)
const place = () => { const tb = $('tx').getBoundingClientRect(); $('by').style.top = Math.min(1080, tb.bottom + 26) + 'px'; };
window.POSTER = 0; window.draw = place; place(); document.fonts && document.fonts.ready.then(place);
</script></body></html>
