<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends «GOLDEN BOOT RACE» (owner, 2026-11-03): the league's top scorers as a race, the bars growing to their goals. */
#lg{top:62px;right:44px;font:700 32px O;letter-spacing:3px;text-transform:uppercase;text-align:right}
#hk{top:150px;width:100%;font:400 140px/0.88 B;letter-spacing:3px;transform:skewX(-8deg);text-shadow:0 8px 40px rgba(0,0,0,.6)}
#rc{position:absolute;left:40px;right:40px;top:470px}
.p{position:relative;height:150px;margin-bottom:16px}
.p .nm{position:absolute;left:0;top:0;font:400 54px/1 B;letter-spacing:1px}.p .nm small{font:700 26px O;color:rgba(255,255,255,.7);letter-spacing:1px;margin-left:10px}
.p .tr{position:absolute;left:0;right:0;top:62px;height:76px;border-radius:38px;background:rgba(4,10,46,.85)}
.p .bar{position:absolute;left:0;top:0;bottom:0;border-radius:38px;background:linear-gradient(90deg,#1d4ed8,#46d7ff);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;min-width:96px}
.p .bar img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}
.p .g{position:absolute;right:16px;top:62px;font:400 76px/76px B;color:#ffd21f}
.p.lead .bar{background:linear-gradient(90deg,#b45309,#ffd21f)}.p .cw{position:absolute;left:-6px;top:30px;font-size:40px;opacity:0}
#cta{bottom:56px}
</style></head><body><div class="bg"></div><div class="streak"></div><div class="logo">FB<i>LEGENDS</i></div><div class="abs" id="lg"></div>
<div class="abs c" id="hk"></div><div id="rc"></div><div class="cta" id="cta"></div>
<script src="lib.js"></script><script src="en-lib.js"></script><script>
const D = window.DATA, P = (D.players || []).slice(0, 7), max = Math.max(1, ...P.map((p) => p.g));
$('lg').textContent = D.league || '';
$('hk').innerHTML = `${D.h1 || 'GOLDEN BOOT'}<br><span class="y">${D.h2 || 'RACE'}</span> 👟`;
$('rc').innerHTML = P.map((p, i) => `<div class="p${i === 0 ? ' lead' : ''}"><div class="nm">${p.name}<small>${p.team}${p.a != null ? ` • ${p.a} ${p.a === 1 ? 'ASSIST' : 'ASSISTS'}` : ''}</small></div><div class="tr"><div class="bar">${p.logo ? `<img src="${p.logo}">` : ''}</div></div><div class="g">0</div></div>`).join('');
$('cta').textContent = D.cta || 'WHO FINISHES TOP? 👇';
const rows = [...document.querySelectorAll('.p')], W = 1000 - 140;
window.TOTAL = 10;
window.draw = (t) => {
  // A race: every bar grows at the same speed and stops at its own goals, so the leader pulls away last.
  const k = eio((t - .4) / 3.6);
  rows.forEach((r, i) => { const g = Math.min(P[i].g, max * k); r.querySelector('.bar').style.width = (96 + W * g / max) + 'px'; r.querySelector('.g').textContent = Math.floor(g + 1e-6); });
  const L = rows[0]; if (L) { const a = ease((t - 4.1) / .4); L.style.transform = `scale(${1 + .03 * a})`; L.querySelector('.tr').style.boxShadow = `0 0 ${40 * a}px rgba(255,210,31,.7)`; }
  const c = ease((t - 4.8) / .5); $('cta').style.opacity = c;
};
progBar();
draw(0);
</script></body></html>
