<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends «WHO'S THAT PLAYER?» (owner, 2026-11-03): his cut-out as a black silhouette from the first frame, his
   numbers one by one, a countdown, then he lights up and his name lands (blurred photo when there is no cut-out). */
#hk{top:150px;width:100%;font:400 140px/0.9 B;letter-spacing:3px;transform:skewX(-8deg);text-shadow:0 6px 30px rgba(0,0,0,.6);z-index:20}
#ring{position:absolute;left:50%;top:360px;width:860px;height:860px;margin-left:-430px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,31,.35),rgba(255,210,31,0) 65%)}
#ph{position:absolute;left:90px;right:90px;top:330px;height:880px}#ph .cut{left:0;right:0;bottom:0;width:100%;height:100%}
#ph .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:34px;border:6px solid #ffd21f}
#q{position:absolute;left:0;right:0;top:520px;text-align:center;font:400 380px B;color:#ffd21f;text-shadow:0 10px 50px rgba(0,0,0,.7);z-index:4}
#cx{top:1235px;width:100%;font:700 36px O;letter-spacing:2px;color:#46d7ff;text-transform:uppercase;z-index:5}
#tl{top:1290px;left:60px;right:60px;display:flex;gap:18px;z-index:5}.tile{flex:1;border-radius:24px;background:rgba(4,10,46,.9);border:2px solid rgba(70,215,255,.45);text-align:center;padding:12px 0;opacity:0}
.tile b{display:block;font:400 136px/1 B;color:#ffd21f}.tile span{font:700 28px O;letter-spacing:2px}
#hints{top:1540px;left:60px;right:60px;display:flex;gap:16px;justify-content:center;z-index:5}.hint{font:700 34px O;padding:10px 26px;border-radius:40px;background:#ffd21f;color:#040a2e;opacity:0}
#cd{top:1600px;width:100%;font:400 140px/1 B;color:#fff;text-shadow:0 0 40px rgba(255,210,31,.8);z-index:5}
#an{top:1230px;width:100%;font:400 160px/0.9 B;letter-spacing:2px;opacity:0;text-shadow:0 8px 40px rgba(0,0,0,.7);z-index:22}#an small{display:block;font:700 42px O;letter-spacing:3px;color:#46d7ff;margin-top:18px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:25}
#cta{bottom:50px;z-index:26}.credit{left:66px;top:1215px}
</style></head><body><div class="bg"></div><div class="streak"></div><div id="ring"></div><div class="logo">FB<i>LEGENDS</i></div>
<div class="abs c" id="hk">WHO'S THAT <span class="y">PLAYER?</span></div><div id="ph"></div><div id="q">?</div>
<div class="abs c" id="cx"></div><div class="abs" id="tl"></div><div class="abs" id="hints"></div><div class="abs c" id="cd"></div>
<div class="abs c" id="an"></div><div id="flash"></div><div class="cta" id="cta"></div><div class="credit" id="cr"></div>
<script src="lib.js"></script><script src="en-lib.js"></script><script>
const D = window.DATA;
starImg($('ph'), D.slug, D.photo);
$('cx').textContent = D.ctx || '';
$('tl').innerHTML = (D.tiles || []).slice(0, 3).map((x) => `<div class="tile"><b>${x.stat}</b><span>${String(x.text).toUpperCase()}</span></div>`).join('');
$('hints').innerHTML = (D.hints || []).slice(0, 3).map((h) => `<div class="hint">${h}</div>`).join('');
$('an').innerHTML = `${D.name}<small>${D.sub || ''}</small>`;
$('cr').textContent = D.credit ? `Photo: ${D.credit} / Wikimedia Commons${D.slug ? ', background removed' : ''}` : '';
const tiles = [...document.querySelectorAll('.tile')], hints = [...document.querySelectorAll('.hint')];
const R = 1 + tiles.length * .9 + hints.length * .9 + 3.2; // the reveal, after the clues and a 3-2-1
window.TOTAL = R + 4.2;
window.draw = (t) => {
  const r = ease((t - R) / .6), im = document.querySelector('#ph img'), cut = im && im.classList.contains('cut');
  if (im) im.style.filter = cut ? `brightness(${r}) drop-shadow(0 0 ${(1 - r) * 4}px #ffd21f) drop-shadow(0 0 ${(1 - r) * 22}px rgba(255,210,31,.8))` : `blur(${46 * (1 - r)}px) brightness(${.75 + .25 * r})`;
  if (im) im.style.transform = `scale(${1 + .03 * Math.sin(t * 2) * (1 - r) + .04 * r})`;
  $('q').style.opacity = (1 - r) * (cut ? .9 : 1); $('q').style.transform = `scale(${1 + .06 * Math.sin(t * 4)})`;
  tiles.forEach((x, i) => { const a = back((t - 1 - i * .9) / .45); x.style.opacity = cl((t - 1 - i * .9) / .2); x.style.transform = `scale(${Math.max(0, a)})`; });
  const h0 = 1 + tiles.length * .9; hints.forEach((h, i) => { const a = ease((t - h0 - i * .9) / .35); h.style.opacity = a; h.style.transform = `translateY(${(1 - a) * 30}px)`; });
  const left = Math.ceil(R - t); $('cd').textContent = t > R - 3 && t < R ? String(left) : ''; $('cd').style.transform = `scale(${1.4 - .4 * ((R - t) % 1)})`;
  const o = 1 - r; ['tl', 'hints', 'cx', 'cd'].forEach((id) => ($(id).style.opacity = o));
  $('flash').style.opacity = .85 * Math.max(0, 1 - Math.abs(t - R) / .25);
  $('an').style.opacity = r; $('an').style.transform = `scale(${t > R ? 1.3 - .3 * back((t - R) / .6) : 1.3})`;
  $('ring').style.opacity = .5 + .5 * Math.sin(t * 3) * (1 - r) + r; $('cr').style.opacity = r;
  $('cta').textContent = t < R ? 'COMMENT YOUR GUESS 👇' : (D.ok || 'DID YOU GET IT RIGHT?');
  $('cta').style.opacity = t < R ? .6 + .4 * Math.abs(Math.sin(t * 2)) : r;
};
draw(0);
</script></body></html>
