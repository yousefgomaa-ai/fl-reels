<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends «Guess the player» (owner, 2026-11-03): his Commons photo blurred from the first frame with his numbers,
   a countdown, then the photo clears and his name lands. */
#hk{top:150px;width:100%;font:400 150px/0.9 B;letter-spacing:3px;transform:skewX(-8deg);text-shadow:0 6px 30px rgba(0,0,0,.6);z-index:20}
#ph{position:absolute;left:60px;right:60px;top:340px;height:760px;border-radius:34px;overflow:hidden;border:6px solid #ffd21f;box-shadow:0 0 60px rgba(255,210,31,.35);background:#0a1a5c}
#ph img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
#q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 420px B;color:rgba(255,255,255,.92);text-shadow:0 10px 50px rgba(0,0,0,.7)}
#cx{top:1125px;width:100%;font:700 38px O;letter-spacing:2px;color:#46d7ff;text-transform:uppercase}
#tl{top:1185px;left:60px;right:60px;display:flex;gap:18px}.tile{flex:1;border-radius:24px;background:rgba(4,10,46,.85);border:2px solid rgba(70,215,255,.4);text-align:center;padding:14px 0}
.tile b{display:block;font:400 140px/1 B;color:#ffd21f}.tile span{font:700 30px O;letter-spacing:2px}
#hints{top:1445px;left:60px;right:60px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.hint{font:700 36px O;padding:10px 26px;border-radius:40px;background:#ffd21f;color:#040a2e}
#cd{top:1560px;width:100%;font:400 200px/1 B;color:#fff;text-shadow:0 0 40px rgba(255,210,31,.8)}
#an{top:1120px;width:100%;font:400 160px/0.9 B;letter-spacing:2px;opacity:0;text-shadow:0 8px 40px rgba(0,0,0,.7);z-index:22}#an small{display:block;font:700 40px O;letter-spacing:3px;color:#46d7ff;margin-top:18px}
#cta{bottom:52px}
.credit{left:66px;top:1104px}
</style></head><body><div class="bg"></div><div class="streak"></div><div class="logo">FB<i>LEGENDS</i></div>
<div class="abs c" id="hk">GUESS THE <span class="y">PLAYER</span></div><div id="ph"></div>
<div class="abs c" id="cx"></div><div class="abs" id="tl"></div><div class="abs" id="hints"></div><div class="abs c" id="cd"></div>
<div class="abs c" id="an"></div><div class="cta" id="cta"></div><div class="credit" id="cr"></div>
<script src="lib.js"></script><script>
const D = window.DATA;
$('ph').innerHTML = `${D.photo ? `<img id="img" src="${D.photo}">` : ''}<div id="q">?</div>`;
$('cx').textContent = D.ctx || '';
$('tl').innerHTML = (D.tiles || []).slice(0, 3).map((x) => `<div class="tile"><b>${x.stat}</b><span>${String(x.text).toUpperCase()}</span></div>`).join('');
$('hints').innerHTML = (D.hints || []).slice(0, 3).map((h) => `<div class="hint">${h}</div>`).join('');
$('an').innerHTML = `${D.name}<small>${D.sub || ''}</small>`;
$('cr').textContent = D.photo && D.credit ? `Photo: ${D.credit} / Wikimedia Commons` : '';
const R = 8.6; // the reveal
window.TOTAL = R + 4.4;
window.draw = (t) => {
  const r = ease((t - R) / .7), im = document.getElementById('img');
  if (im) { im.style.filter = `blur(${46 * (1 - r)}px) brightness(${.75 + .25 * r})`; im.style.transform = `scale(${1.25 - .15 * r})`; }
  $('q').style.opacity = 1 - r; $('q').style.transform = `scale(${1 + .05 * Math.sin(t * 4)})`;
  const left = Math.ceil(R - t); $('cd').textContent = t > R - 3 && t < R ? String(left) : ''; $('cd').style.transform = `scale(${1.35 - .35 * ((R - t) % 1)})`;
  document.querySelectorAll('.hint').forEach((h, i) => { const a = ease((t - 1.6 - i * 1.3) / .4); h.style.opacity = a; h.style.transform = `scale(${.7 + .3 * a})`; });
  const o = 1 - r; ['tl', 'hints', 'cx'].forEach((id) => ($(id).style.opacity = o)); $('cd').style.opacity = o;
  $('an').style.opacity = r; $('an').style.transform = `scale(${1.3 - .3 * back((t - R) / .6)})`;
  $('cr').style.opacity = r;
  $('cta').textContent = t < R ? 'COMMENT BEFORE THE REVEAL 👇' : (D.ok || 'DID YOU GET IT RIGHT?');
  $('cta').style.opacity = t < R ? .55 + .45 * Math.abs(Math.sin(t * 2)) : r;
};
draw(0);
</script></body></html>
