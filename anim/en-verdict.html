<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends «MESSI vs RONALDO: THE FINAL VERDICT» (owner, 2026-11-05: «فيديو يضرب ... الهوك ... اللي يتفرج ما يسيبوش غير
   وهو خلصان ويعيده»; the voice explains every round, the numbers club and country together): two photos face to face,
   ten rounds one at a time (the category, both numbers hidden, then revealed as the voice says them, the point and the
   score), level at the end, the decider left to the comments, the last frame the first one again so it loops. */
#ph{position:absolute;left:0;right:0;top:0;height:900px;overflow:hidden}
.pp{position:absolute;top:0;height:900px;width:560px;overflow:hidden}
.pp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
#pl{left:0;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}#pr{right:0;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)}
.pp:after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(var(--bx),0) 55%,rgba(var(--bx),.95))}
#pl:after{box-shadow:inset 0 0 0 0 transparent}
.nm{position:absolute;top:760px;font:400 110px/1 B;letter-spacing:3px;z-index:5;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#nl{left:40px}#nr{right:40px}
#sb{position:absolute;top:880px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;z-index:6;background:var(--dk);border:5px solid #ffd21f;border-radius:30px;padding:6px 34px}
#sb b{font:400 130px/1 B;width:90px;text-align:center}#sb i{font:400 70px B;color:#ffd21f;font-style:normal}
#rk{position:absolute;top:1075px;left:0;right:0;text-align:center;font:700 34px O;letter-spacing:8px;color:var(--kc)}
#ct{position:absolute;top:1125px;left:40px;right:40px;text-align:center;font:400 112px/0.95 B;letter-spacing:2px;transform:skewX(-6deg)}
#cs{position:absolute;top:1245px;left:0;right:0;text-align:center;font:700 30px O;letter-spacing:5px;color:#c9d6ff}
.vb{position:absolute;top:1320px;width:470px;height:280px;border-radius:32px;background:rgba(var(--bx),.92);border:5px solid rgba(var(--kl),.5);display:flex;flex-direction:column;align-items:center;justify-content:center}
#vl{left:45px}#vr{right:45px}
.vb b{font:400 190px/1 B;letter-spacing:3px}.vb small{font:700 30px O;letter-spacing:2px;color:var(--sm);margin-top:6px;min-height:36px}
.vb.win{border-color:#ffd21f;box-shadow:0 0 60px rgba(255,210,31,.55)}.vb.win b{color:#ffd21f}
#pt{position:absolute;top:1640px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#ffd21f;color:var(--dk);font:400 64px B;letter-spacing:3px;padding:8px 34px;border-radius:16px;z-index:7}
#hk{position:absolute;top:1080px;left:40px;right:40px;text-align:center}
#hk .a{font:400 150px/0.9 B;letter-spacing:3px;transform:skewX(-6deg)}#hk .b2{margin-top:30px;font:700 40px O;letter-spacing:6px;color:var(--kc)}
#hk .c2{margin:40px auto 0;display:inline-block;background:#ffd21f;color:var(--dk);font:400 60px B;letter-spacing:3px;padding:8px 34px;border-radius:16px}
#fn{position:absolute;top:1080px;left:40px;right:40px;text-align:center}
#fn .a{font:400 96px/1 B;letter-spacing:2px}#fn .b2{margin-top:26px;font:400 140px/0.9 B;letter-spacing:3px;color:#ffd21f;transform:skewX(-6deg)}
#fn .c2{margin-top:34px;font:700 40px O;letter-spacing:4px;color:#c9d6ff}
.credit{bottom:18px}
#ol{position:absolute;top:670px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#e0283f;color:#fff;font:400 54px B;letter-spacing:3px;padding:8px 30px;border-radius:14px;opacity:0;z-index:8}
#jy{position:absolute;top:1060px;left:40px;right:40px;opacity:0}
#jy .h{text-align:center;font:400 96px/1 B;letter-spacing:3px;transform:skewX(-6deg)}#jy .h i{font-style:normal;color:#ffd21f}
#jy .r{display:flex;align-items:center;gap:18px;margin-top:14px;background:rgba(var(--bx),.92);border:3px solid rgba(var(--kl),.35);border-radius:20px;padding:10px 22px;opacity:0}
#jy .r.nat{border-color:#ffd21f;background:rgba(60,45,0,.85)}
#jy .r .c{flex:1;font:400 52px/1 B;letter-spacing:2px;white-space:nowrap;overflow:hidden}#jy .r .c small{display:block;font:700 22px O;letter-spacing:3px;color:var(--sm);margin-top:4px}
#jy .r .n{text-align:center;width:150px;font:400 64px/1 B}#jy .r .n small{display:block;font:700 18px O;letter-spacing:3px;color:var(--sm)}
#jy .r .g b{color:#ffd21f}#cl{left:24px}#cr{right:24px;text-align:right}
</style></head><body><div class="bg"></div><div class="streak"></div><div class="logo">FB<i>LEGENDS</i></div>
<div id="ph"><div class="pp" id="pl"><img id="il"></div><div class="pp" id="pr"><img id="ir"></div></div>
<div class="nm" id="nl"></div><div class="nm" id="nr"></div>
<div id="sb"><b id="sl">0</b><i>-</i><b id="sr">0</b></div>
<div id="hk"><div class="a"></div><div class="b2"></div><div class="c2"></div></div>
<div id="rd"><div id="rk"></div><div id="ct"></div><div id="cs"></div>
  <div class="vb" id="vl"><b></b><small></small></div><div class="vb" id="vr"><b></b><small></small></div><div id="pt"></div></div>
<div id="jy"><div class="h"></div><div class="rows"></div></div>
<div id="ol"></div>
<div id="fn"><div class="a"></div><div class="b2"></div><div class="c2"></div></div>
<div class="credit" id="cl"></div><div class="credit" id="cr"></div>
<script src="lib.js"></script><script src="en-lib.js"></script><script>
const D = window.DATA, A = D.a || {}, Bp = D.b || {}, R = D.rounds || [], n = R.length;
$('il').src = A.photo || ''; $('ir').src = Bp.photo || ''; $('nl').textContent = A.name || ''; $('nr').textContent = Bp.name || '';
$('cl').textContent = A.credit ? '📷 ' + A.credit : ''; $('cr').textContent = Bp.credit ? '📷 ' + Bp.credit : '';
$('hk').querySelector('.a').innerHTML = D.hook || 'THIS SETTLES IT.<br><span class="y">FOREVER.</span>';
$('hk').querySelector('.b2').textContent = D.hookSub || `${n} ROUNDS • CLUB AND COUNTRY`;
$('hk').querySelector('.c2').textContent = D.hookCta || 'WHO WINS? 👀';
$('fn').querySelector('.a').innerHTML = D.endA || "THE NUMBERS CAN'T SPLIT THEM";
$('fn').querySelector('.b2').innerHTML = D.endB || 'THE DECIDER IS YOU 👇';
$('fn').querySelector('.c2').textContent = D.endC || 'COMMENT MESSI OR RONALDO';
// The beats: the hook, each round, the end (DATA.beats from the voice, else these minimums).
// Each player's journey before the rounds (owner, 2026-11-10: «يوضح مسيرة كل لاعب مع الفرق و مساهمتهم و المنتخبات»): club by
// club, the years, games and goals, the national team last; one beat each, after the hook.
const P = D.paths || [], np = P.length;
const fmt = (v) => Number(v).toLocaleString('en-GB');
const setPath = (j) => { const p = P[j], who = p.who === 'b' ? Bp : A;
  $('jy').querySelector('.h').innerHTML = `${who.name}'S <i>JOURNEY</i>`;
  $('jy').querySelector('.rows').innerHTML = p.rows.map((r) => `<div class="r${r.nat ? ' nat' : ''}"><div class="c">${r.club}<small>${r.years}</small></div><div class="n"><span data-v="${r.apps}">0</span><small>GAMES</small></div><div class="n g"><b data-v="${r.goals}">0</b><small>GOALS</small></div></div>`).join(''); };
let curP = -1;
const mins = D.minBeats || [4.5, ...P.map(() => 9), ...R.map(() => 6.5), 6], B = D.beats || (() => { let t = 0; return mins.map((m) => { const b = [t, m]; t += m; return b; }); })();
window.TOTAL = B[B.length - 1][0] + B[B.length - 1][1];
const score = (k) => R.slice(0, k).reduce((s, r) => [s[0] + (r.win === 'a' ? 1 : 0), s[1] + (r.win === 'b' ? 1 : 0)], [0, 0]);
let cur = -1;
const setRound = (i) => {
  const r = R[i]; $('rk').textContent = i === n - 1 ? 'THE DECIDING ROUND 🔥' : `ROUND ${i + 1} OF ${n}`; $('ct').innerHTML = r.title; $('cs').textContent = r.sub || '';
  $('vl').querySelector('b').textContent = ''; $('vr').querySelector('b').textContent = ''; // (owner, 2026-11-10: «بلاش شغل علامة استفهام ... فين البروفشنال»: nothing hidden behind «?»)
  $('vl').querySelector('small').textContent = ''; $('vr').querySelector('small').textContent = '';
  $('pt').textContent = r.win === 'a' ? `POINT ${A.name} ✅` : r.win === 'b' ? `POINT ${Bp.name} ✅` : 'NO POINT';
};
window.draw = (t) => {
  const bi = B.findIndex(([s, l]) => t >= s && t < s + l), k = bi < 0 ? B.length - 1 : bi, [s, l] = B[k], u = t - s;
  const isH = k === 0, isE = k === B.length - 1, isJ = !isH && !isE && k <= np, isR = !isH && !isE && !isJ, i = k - 1 - np;
  $('jy').style.opacity = isJ ? Math.min(ease(u / .3), 1 - ease((u - l + .3) / .3)) : 0;
  if (isJ) {
    const j = k - 1; if (curP !== j) { setPath(j); curP = j; }
    const rows = [...$('jy').querySelectorAll('.r')], per = Math.min(1.1, (l - 2.5) / Math.max(rows.length, 1));
    rows.forEach((el, q) => { const a = u - .6 - q * per; el.style.opacity = ease(a / .3); el.style.transform = `translateX(${(1 - ease(a / .4)) * (P[j].who === 'b' ? 80 : -80)}px)`;
      el.querySelectorAll('[data-v]').forEach((x) => { x.textContent = fmt(Math.round(Number(x.dataset.v) * Math.min(1, Math.max(0, a / .8)))); }); });
    // the other player's photo dims while this one's journey is told
    $('pl').style.filter = P[j].who === 'b' ? 'brightness(.45)' : 'none'; $('pr').style.filter = P[j].who === 'b' ? 'none' : 'brightness(.45)';
  }
  // The photos come in from the sides on the hook and stay; the end brings them back full, like the start (the loop).
  const pin = ease(Math.min(1, t / .5)); $('pl').style.transform = `translateX(${(1 - pin) * -560}px)`; $('pr').style.transform = `translateX(${(1 - pin) * 560}px)`;
  $('hk').style.opacity = isH ? Math.min(ease(u / .3), 1 - ease((u - l + .3) / .3)) : 0;
  if (isH) $('hk').querySelector('.a').style.transform = `skewX(-6deg) scale(${1.25 - .25 * ease(u / .5)})`;
  $('rd').style.opacity = isR ? Math.min(ease(u / .25), 1 - ease((u - l + .25) / .25)) : 0;
  let sc = score(isE ? n : Math.max(0, i));
  if (isR) {
    if (cur !== i) { setRound(i); cur = i; }
    const r = R[i], ra = l * .36, rb = l * .56, rp = l * .74;
    const show = (id, at, v, sm) => { const box = $(id), on = u >= at; box.querySelector('b').textContent = on ? (/^[\d,]+$/.test(String(v)) ? Number(String(v).replace(/,/g, '') * Math.min(1, (u - at) / .6)).toLocaleString('en-GB', { maximumFractionDigits: 0 }) : v) : ''; box.querySelector('small').textContent = on ? (sm || '') : '';
      box.style.transform = `scale(${on ? 1.12 - .12 * back((u - at) / .45) : 1})`; };
    show('vl', ra, r.av, r.as); show('vr', rb, r.bv, r.bs);
    $('vl').classList.toggle('win', u >= rp && r.win === 'a'); $('vr').classList.toggle('win', u >= rp && r.win === 'b');
    $('pt').style.opacity = ease((u - rp) / .25); $('pt').style.transform = `translateX(-50%) scale(${u >= rp ? 1.15 - .15 * back((u - rp) / .5) : .8})`;
    if (u >= rp) sc = score(i + 1);
    // An open loop on some rounds (owner, 2026-11-10, his five-stage plan: «فتح الحلقات»): a promise of what is still to come.
    const tz = (D.teases || {})[i + 1]; $('ol').textContent = tz || ''; $('ol').style.opacity = tz ? Math.min(ease((u - .2) / .25), 1 - ease((u - ra + .2) / .25)) : 0;
    // The point's winner pushed in a little (a change of frame every round).
    const zw = u >= rp ? ease((u - rp) / .5) : 0; $('il').style.transform = `scale(${1 + (r.win === 'a' ? .07 * zw : 0)})`; $('ir').style.transform = `scale(${1 + (r.win === 'b' ? .07 * zw : 0)})`;
    $('ct').style.transform = `skewX(-6deg) translateY(${(1 - ease(u / .35)) * 30}px)`;
    // The loser's photo dims a little once the point is given.
    $('pl').style.filter = u >= rp && r.win === 'b' ? 'brightness(.6)' : 'none'; $('pr').style.filter = u >= rp && r.win === 'a' ? 'brightness(.6)' : 'none';
  } else if (!isJ) { $('pl').style.filter = $('pr').style.filter = 'none'; }
  if (!isR) { $('ol').style.opacity = 0; $('il').style.transform = $('ir').style.transform = 'none'; }
  $('sl').textContent = sc[0]; $('sr').textContent = sc[1];
  $('sb').style.opacity = isH ? ease((u - 1.2) / .3) : isJ ? 0 : 1;
  $('fn').style.opacity = isE ? ease(u / .35) : 0;
  if (isE) { $('fn').querySelector('.b2').style.transform = `skewX(-6deg) scale(${1 + .05 * Math.sin(u * 5)})`; $('sb').style.transform = `translateX(-50%) scale(${1.15 + .05 * Math.sin(u * 4)})`; }
  else $('sb').style.transform = 'translateX(-50%)';
};
window.POSTER = Math.min(2.2, B[0][1] - .2);
progBar();
draw(0);
</script></body></html>
