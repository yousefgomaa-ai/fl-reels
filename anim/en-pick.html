<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends photo post «PICK ONE» (owner, 2026-11-04: «ممكن نضيف صور بردة»): a 1080x1350 picture for the feed, two
   stars face to face with one number each, the viewer comments his pick. No reaction voting (Facebook demotes it). */
body{height:1350px}
.half{position:absolute;top:0;bottom:0;width:540px;overflow:hidden}#ha{left:0;background:radial-gradient(700px 700px at 40% 40%,#8a1230,#2a0510)}#hb{right:0;background:radial-gradient(700px 700px at 60% 40%,#1846b8,#06123d)}
.half .im{position:absolute;left:0;right:0;top:150px;height:560px}
.half .im img.ph{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.half .im img.cut{left:0;right:0;bottom:0;width:100%;height:100%}
.half .im img.crest{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;object-fit:contain;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.half .fd{position:absolute;left:0;right:0;top:520px;height:190px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.9))}
.nm{position:absolute;left:20px;right:20px;top:592px;text-align:center;font:400 84px/0.9 B;letter-spacing:2px;text-shadow:0 6px 24px rgba(0,0,0,.6);white-space:nowrap}
.sb{position:absolute;left:20px;right:20px;top:672px;text-align:center;font:700 24px O;letter-spacing:2px;color:#ffd21f}
/* The numbers side by side (owner, 2026-11-05: «نضيف فيها دقائق اللعب والاسستات المسهمات والاجوان وكل شيء»): the
   better of each row in gold; fewer minutes per goal or assist is the better one. */
#tbl{position:absolute;left:0;right:0;top:720px;bottom:110px;background:var(--dk);z-index:5;padding:10px 26px 0}
.rw{display:flex;align-items:center;height:68px;border-bottom:2px solid rgba(255,255,255,.08)}
.rw b{width:200px;text-align:center;font:400 62px/1 B;letter-spacing:1px;color:#fff}.rw b.w{color:#ffd21f}
.rw span{flex:1;text-align:center;font:700 26px O;letter-spacing:3px;color:rgba(255,255,255,.75)}
#hk{position:absolute;top:0;left:0;right:0;height:150px;background:var(--dk);z-index:5}#hk div{position:absolute;right:40px;top:28px;font:400 96px/1 B;letter-spacing:2px;transform:skewX(-8deg)}
#vs{left:50%;top:380px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:#ffd21f;color:var(--dk);font:400 86px/154px B;text-align:center;z-index:6;box-shadow:0 0 0 10px var(--dk)}
#line{left:537px;top:150px;height:570px;width:6px;background:#ffd21f;z-index:4}
#cta{position:absolute;left:0;right:0;bottom:0;height:110px;background:#ffd21f;color:var(--dk);text-align:center;font:400 64px/110px B;letter-spacing:2px;z-index:6}
.credit{top:156px;bottom:auto;font-size:15px;z-index:6;text-shadow:0 1px 4px #000}#cra{left:14px}#crb{right:14px;text-align:right}
</style></head><body><div class="bg"></div>
<div class="half" id="ha"></div><div class="half" id="hb"></div><div class="abs" id="line"></div><div class="abs" id="vs">OR</div>
<div id="hk"><div>PICK <span class="y">ONE</span></div></div><div class="logo">FB<i>LEGENDS</i></div>
<div id="tbl"></div><div id="cta"></div><div class="credit" id="cra"></div><div class="credit" id="crb"></div>
<script src="lib.js"></script><script src="en-lib.js"></script><script>
const D = window.DATA;
if (D.head) document.querySelector('#hk div').innerHTML = D.head;
const half = (x) => `<div class="im"></div><div class="fd"></div><div class="nm">${x.short}</div><div class="sb">${x.sub || ''}</div>`;
$('ha').innerHTML = half(D.a); $('hb').innerHTML = half(D.b);
$('tbl').innerHTML = (D.stats || [[D.a.label || 'GOALS', D.a.v, D.b.v, '']]).map(([l, x, y, w]) => `<div class="rw"><b class="${w === 'a' ? 'w' : ''}">${x}</b><span>${l}</span><b class="${w === 'b' ? 'w' : ''}">${y}</b></div>`).join('');
// A long name shrinks to its half.
document.querySelectorAll('.nm').forEach((el) => { let f = 84; while (el.scrollWidth > el.clientWidth + 1 && f > 44) { f -= 4; el.style.fontSize = f + 'px'; } });
const pic = (el, x) => { if (x.slug || x.photo) return starImg(el, x.slug, x.photo); if (x.logo) el.innerHTML = `<img class="crest" src="${x.logo}">`; };
pic(document.querySelector('#ha .im'), D.a); pic(document.querySelector('#hb .im'), D.b);
const cr = (x) => (x.credit && (x.slug || x.photo) ? `Photo: ${x.credit} / Wikimedia Commons${x.slug ? ', background removed' : ''}` : '');
$('cra').textContent = cr(D.a); $('crb').textContent = cr(D.b);
$('cta').textContent = D.cta || `COMMENT ${D.a.short} OR ${D.b.short} 👇`;
window.TOTAL = 1; window.POSTER = 1; window.draw = () => {};
</script></body></html>
