<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* «تصريح» صورة لا ريل (owner, 2026-11-15: «التصريحات دي تنزل صور مش ريلز»): the Arabic pages' 1080x1350 card, the same
   checked quote in MSA as ar-quote: the photo, the words, who said it, where, the source and the question. */
html,body{width:1080px!important;height:1350px!important;overflow:hidden}
body{background:#050812;color:#fff;font-family:C}
.ph{position:absolute;left:0;right:0;top:0;height:640px;overflow:hidden;background:#0b1640}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph:after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(5,8,18,.1),rgba(5,8,18,0) 40%,rgba(5,8,18,.85) 82%,#050812)}
.ci{display:none;position:absolute;left:50%;top:90px;width:400px;height:400px;margin-left:-200px;border-radius:50%;overflow:hidden;border:8px solid #ffd23f;background:#fff;z-index:1}
.ci img{width:100%;height:100%;object-fit:contain;padding:30px}
.sm .ci{display:block}.sm>img{filter:blur(24px) brightness(.4)}
.lg{position:absolute;left:44px;top:40px;direction:ltr;font:900 30px Arial,sans-serif;letter-spacing:6px;z-index:3;background:linear-gradient(90deg,#22e9ff,#ff2f97);-webkit-background-clip:text;color:transparent}
.tg{position:absolute;right:44px;top:30px;background:#ffd23f;color:#050812;font-weight:900;font-size:44px;line-height:1.3;padding:2px 28px;border-radius:14px;z-index:3}
.cr{position:absolute;left:24px;top:604px;direction:ltr;font:500 18px Arial;color:rgba(255,255,255,.7);z-index:3}
.mk{position:absolute;right:40px;top:470px;font:900 260px/1 Arial;color:#ffd23f;z-index:2;text-shadow:0 0 50px rgba(255,210,63,.35)}
.tx{position:absolute;left:60px;right:60px;top:650px;font-weight:900;font-size:64px;line-height:1.35;z-index:2}
.by{position:absolute;left:60px;right:60px;top:0;display:flex;flex-direction:column;gap:4px}
.by b{font-weight:900;font-size:50px;line-height:1.2;color:#ffd23f}.by small{font-weight:700;font-size:30px;line-height:1.4;color:#c7d2f5}
.qq{position:absolute;left:60px;right:60px;bottom:120px;display:flex;align-items:center;gap:24px}
.qq .h{flex:1;font-weight:900;font-size:58px;line-height:1.2}.qq .h i{font-style:normal;color:#ffd23f}
.qq .p{width:150px;height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:50px;border:5px solid #2fe37a;background:rgba(47,227,122,.14)}
.qq .p.n{border-color:#ff3b5c;background:rgba(255,59,92,.14)}
.so{position:absolute;left:60px;right:60px;bottom:52px;font-weight:700;font-size:26px;color:#8f9cc8}
</style></head><body>
<div class="ph"><img id="p1"><div class="ci"><img id="p2"></div></div>
<div class="lg">FOOTBALL LEGENDS</div><div class="tg" id="tg">تصريح</div><div class="cr" id="cr"></div>
<div class="mk">”</div><div class="tx" id="tx"></div><div class="by" id="by"><b id="nm"></b><small id="cx"></small></div>
<div class="qq"><div class="h" id="h"></div><div class="p">نعم</div><div class="p n">لا</div></div><div class="so" id="so"></div>
<script>
const D = window.DATA || {}, W = D.who || {}, $ = (i) => document.getElementById(i);
$('p1').src = W.photo || ''; $('p1').style.objectPosition = W.pos || '50% 20%'; $('p2').src = W.photo || '';
document.querySelector('.ph').classList.toggle('sm', !!W.small); if (!W.photo) document.querySelector('.ph').style.background = 'radial-gradient(800px 500px at 50% 30%,#1b2f7a,#050812)';
$('cr').textContent = W.credit ? '📷 ' + W.credit + ' • Wikimedia Commons' : '';
const q = String(D.quote || ''), len = q.length;
$('tx').textContent = '«' + q + '»'; $('tx').style.fontSize = (len > 240 ? 42 : len > 180 ? 48 : len > 130 ? 54 : len > 90 ? 60 : 68) + 'px';
$('nm').innerHTML = D.name || ''; $('cx').textContent = [D.about ? 'عن ' + D.about : '', D.context || ''].filter(Boolean).join(' • ');
$('h').innerHTML = D.endH || 'هل معه <i>حق؟</i>'; $('so').textContent = D.source ? 'المصدر: ' + D.source : '';
// the speaker's line right under the quote, however long it is (laid out in draw(), after the fonts are in)
const place = () => { const tb = $('tx').getBoundingClientRect(); $('by').style.top = Math.min(1060, tb.bottom + 20) + 'px'; };
window.POSTER = 0; window.draw = place; place(); document.fonts && document.fonts.ready.then(place);
</script></body></html>
