<!doctype html><html dir="ltr" lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* FB Legends weekend / match-day schedule (owner, 2026-11-03): the biggest match fills the first frame, then the rest
   five at a time, UK time and US Eastern time. */
#date{top:200px;width:100%;font-size:40px;font-weight:700;color:#c9d0f5}
#hero{top:280px;left:50px;right:50px;height:430px;border-radius:34px;background:linear-gradient(160deg,rgba(40,20,110,.95),rgba(17,25,56,.95));border:3px solid #ff2f97}
#hero img{position:absolute;top:70px;width:200px;height:200px;object-fit:contain}#hero .n{position:absolute;top:290px;width:340px;font-weight:900;font-size:42px;line-height:1.1}
#hero .lg{top:22px;width:100%;font-size:30px;color:#22e9ff;font-weight:700}#hero .t{top:110px;left:50%;transform:translateX(-50%);font:900 78px Arial;white-space:nowrap}#hero .et{top:205px;left:50%;transform:translateX(-50%);font-size:30px;color:#c9d0f5;white-space:nowrap}
#hero .tag{top:385px;left:50%;transform:translateX(-50%);background:#ff2f97;font-weight:900;font-size:30px;padding:2px 26px;border-radius:20px;white-space:nowrap}
.m{left:50px;right:50px;height:160px;border-radius:26px;background:rgba(17,25,56,.92);border:2px solid rgba(34,233,255,.25);display:flex;align-items:center;padding:0 20px;gap:12px}
.m img{width:76px;height:76px;object-fit:contain}.m .nm{flex:1;font-weight:900;font-size:33px;line-height:1.12;overflow:hidden;max-height:76px}.m .nm.r{text-align:right}
.m .tm{width:210px;text-align:center}.m .tm b{display:block;font-size:40px;font-weight:900}.m .tm i{display:block;font-style:normal;font-size:22px;color:#8f98bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pg{top:1700px;width:100%;font-size:28px;color:#8f98bd;font-weight:700}
#cta{bottom:200px;width:100%;font-weight:900;font-size:60px;line-height:1.15;padding:0 50px}
</style></head><body><div class="bg"></div><div class="grid"></div><div class="bar" style="top:0"></div><div class="brand">FB LEGENDS</div><div class="chip" id="chip"></div>
<div class="abs c" id="date"></div><div class="abs" id="hero"></div>
<div id="list"></div><div class="abs c" id="pg"></div><div class="abs c" id="cta"></div><div class="foot">football-legend.com</div><div class="bar" style="bottom:0"></div>
<script src="lib.js"></script><script>
const D = window.DATA, B = D.big, R = D.rows || [], PER = 5, PAGES = Math.min(5, Math.ceil(R.length / PER)), Y = 760, GAP = 182;
$('chip').textContent = D.chip || "THIS WEEKEND"; $('date').textContent = (D.label || '') + ' • UK time'; $('cta').textContent = D.cta || 'Which game are you watching? 👇';
const img = (u) => (u ? `<img src="${u}">` : '<span style="width:76px"></span>');
if (B) $('hero').innerHTML = `<div class="abs c lg">${B.league}</div>${B.homeLogo ? `<img style="left:60px" src="${B.homeLogo}">` : ''}${B.awayLogo ? `<img style="right:60px" src="${B.awayLogo}">` : ''}<div class="n c" style="left:0">${B.home}</div><div class="n c" style="right:0">${B.away}</div><div class="abs t">${B.time}</div><div class="abs et">${B.et || ''}</div><div class="abs tag">${B.tag || 'GAME OF THE WEEK'}</div>`;
else $('hero').style.display = 'none';
const rows = R.slice(0, PAGES * PER).map((m, i) => {
  const d = document.createElement('div'); d.className = 'abs m'; d.style.top = (Y + (i % PER) * GAP) + 'px';
  d.innerHTML = `${img(m.homeLogo)}<div class="nm">${m.home}</div><div class="tm"><b>${m.time}</b><i>${m.sub || m.league}</i></div><div class="nm r">${m.away}</div>${img(m.awayLogo)}`;
  $('list').appendChild(d); return d;
});
const T0 = 1.6, PT = 3;
window.TOTAL = T0 + Math.max(1, PAGES) * PT + 2.4;
window.draw = (t) => {
  // The big match is there at t=0, with a glow.
  if (B) $('hero').style.boxShadow = `0 0 ${40 + 30 * Math.sin(t * 4)}px rgba(255,47,151,.45)`;
  rows.forEach((r, i) => {
    const pg = Math.floor(i / PER), s = T0 + pg * PT, k = i % PER, last = pg === PAGES - 1;
    const a = ease((t - s - k * .15) / .4), o = last ? 0 : ease((t - s - PT + .4 - k * .05) / .3);
    r.style.opacity = a * (1 - o); r.style.transform = `translateX(${(1 - a) * 300 - o * 300}px)`;
  });
  const p = Math.min(PAGES - 1, Math.max(0, Math.floor((t - T0) / PT)));
  $('pg').textContent = PAGES > 1 ? `${p + 1} / ${PAGES}` : ''; $('pg').style.opacity = cl((t - T0) / .4);
  const ce = window.TOTAL - 2.2, k = ease((t - ce) / .5);
  $('list').style.opacity = 1 - k; $('pg').style.opacity *= (1 - k); if (B) $('hero').style.filter = `blur(${k * 8}px)`;
  $('cta').style.opacity = ease((t - ce - .2) / .5); $('cta').style.transform = `scale(${.8 + .2 * back((t - ce - .2) / .5)})`;
};
draw(0);
</script></body></html>
