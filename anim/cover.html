<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* A reel's cover (owner, 2026-11-10: «كل ريل يتعمل يتعمله صورة مصغرة احترافية»): the reel's own first frame, blurred and
   darkened, its crests or photos in rings, the headline big in the middle third (what the profile grid and the reels
   tab keep), a play line under it. English in Bebas Neue, Arabic in Cairo. */
@font-face{font-family:C;src:url(../career/cairo700.woff2);font-weight:700}@font-face{font-family:C;src:url(../career/cairo900.woff2);font-weight:900}
body{background:#05070f}
#bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(10px) brightness(.55) saturate(1.25)}
#sh{position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 52%,rgba(0,0,0,0),rgba(0,0,0,.55)),linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.6))}
#br{position:absolute;top:70px;left:0;right:0;text-align:center;font:400 70px/0.85 B;letter-spacing:3px;transform:skewX(-8deg)}#br i{font-style:normal;color:#ffd21f}
#ims{position:absolute;top:420px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:40px}
#ims div{width:330px;height:330px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 10px #ffd21f,0 30px 60px rgba(0,0,0,.6);overflow:hidden;display:flex;align-items:center;justify-content:center}
#ims div.ph{background:#222}#ims img{width:78%;height:78%;object-fit:contain}#ims div.ph img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
#ims b{font:400 110px B;color:#ffd21f;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#hl{position:absolute;left:60px;right:60px;top:860px;text-align:center}
#t{font:400 150px/0.92 B;letter-spacing:2px;text-shadow:0 10px 40px rgba(0,0,0,.8);text-transform:uppercase}
#s{margin-top:28px;display:inline-block;background:#ffd21f;color:#05070f;font:400 62px/1.05 B;letter-spacing:2px;padding:10px 30px;border-radius:14px;max-width:960px}
#pl{position:absolute;left:0;right:0;top:1560px;text-align:center;font:700 40px O;letter-spacing:6px;color:#fff;opacity:.9}
body.ar #t{font:900 120px/1.15 C;letter-spacing:0;text-transform:none}body.ar #s{font:700 54px/1.4 C;letter-spacing:0}body.ar #pl{font:700 42px C;letter-spacing:0}
</style></head><body><div id="bg"></div><div id="sh"></div><div id="br">FB<i> LEGENDS</i></div><div id="ims"></div>
<div id="hl"><div id="t"></div><div id="s"></div></div><div id="pl"></div>
<script>
const D = window.DATA || {}, $ = (i) => document.getElementById(i);
if (D.lang === 'ar') { document.body.classList.add('ar'); document.documentElement.dir = 'rtl'; $('br').innerHTML = 'FOOTBALL<i> LEGENDS</i>'; }
if (D.theme) document.body.classList.add('t-' + D.theme);
$('bg').style.backgroundImage = D.bg ? `url(${D.bg})` : 'none';
const im = (D.imgs || []).slice(0, 2);
$('ims').innerHTML = im.map((x) => `<div class="${x.photo ? 'ph' : ''}"><img src="${x.src}"></div>`).join(im.length === 2 ? '<b>VS</b>' : '');
if (!im.length) $('hl').style.top = '640px';
$('t').textContent = D.title || ''; $('s').textContent = D.sub || ''; if (!D.sub) $('s').style.display = 'none';
$('pl').textContent = D.lang === 'ar' ? '▶ شاهد حتى النهاية' : '▶ WATCH TO THE END';
// the headline shrinks until it fits three lines
const fit = (el, max, min) => { let f = max; el.style.fontSize = f + 'px'; while (f > min && el.scrollHeight > f * (D.lang === 'ar' ? 1.15 : 0.92) * 3 + 6) { f -= 4; el.style.fontSize = f + 'px'; } };
document.fonts.ready.then(() => { fit($('t'), D.lang === 'ar' ? 120 : 150, 60); window.READY = true; });
</script></body></html>
