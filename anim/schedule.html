<!doctype html><html dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* «مباريات اليوم» moving (owner, 2026-11-03): the day's biggest match in a card, then the others five at a time. */
#date{top:185px;width:100%;font-weight:700;font-size:40px;color:#22e9ff}
#hero{top:270px;left:60px;right:60px;height:430px;border-radius:36px;background:linear-gradient(135deg,#1b2a6b,#3a0f4f);border:3px solid #ff2f97;overflow:hidden}
#hero .lg{top:26px;width:100%;font-size:32px;color:#c9d0f5;font-weight:700}
#hero img{position:absolute;top:95px;width:190px;height:190px;object-fit:contain}
#hero .n{position:absolute;top:295px;width:330px;font-weight:900;font-size:40px;line-height:1.15}
#hero .t{top:150px;left:50%;transform:translateX(-50%);font-weight:900;font-size:76px;direction:ltr}
#hero .tv{top:250px;left:50%;transform:translateX(-50%);font-size:28px;color:#22e9ff;white-space:nowrap}
#hero .tag{top:362px;left:50%;transform:translateX(-50%);background:#ff2f97;font-weight:900;font-size:28px;padding:2px 24px;border-radius:20px;white-space:nowrap}
.m{left:60px;right:60px;height:160px;border-radius:26px;background:rgba(17,25,56,.92);border:2px solid rgba(34,233,255,.25);display:flex;align-items:center;padding:0 22px;gap:14px}
.m img{width:80px;height:80px;object-fit:contain}.m .nm{flex:1;font-weight:900;font-size:34px;line-height:1.15;overflow:hidden;max-height:80px}.m .nm.l{text-align:left}
.m .tm{width:200px;text-align:center}.m .tm b{display:block;font-size:44px;font-weight:900;direction:ltr}.m .tm i{display:block;font-style:normal;font-size:21px;color:#8f98bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pg{top:1690px;width:100%;font-size:28px;color:#8f98bd;font-weight:700}
#cta{bottom:200px;width:100%;font-weight:900;font-size:62px}
</style></head><body><div class="bg"></div><div class="grid"></div><div class="bar" style="top:0"></div><div class="brand">FOOTBALL LEGENDS</div><div class="chip" id="chip">مباريات اليوم</div>
<div class="abs c" id="date"></div><div class="abs" id="hero"></div>
<div id="list"></div><div class="abs c" id="pg"></div><div class="abs c" id="cta">أي مباراة ستتابع؟</div><div class="foot">football-legend.com</div><div class="bar" style="bottom:0"></div>
<script src="lib.js"></script><script>
const D = window.DATA, B = D.big, R = D.rows || [], PER = 5, PAGES = Math.min(6, Math.ceil(R.length / PER)), Y = B ? 760 : 300, GAP = B ? 182 : 230;
$('date').textContent = (D.label || '') + ' • بتوقيت القاهرة';
const img = (u) => (u ? `<img src="${u}">` : '<span style="width:80px"></span>');
if (B) $('hero').innerHTML = `<div class="abs c lg">${B.league}</div>${B.homeLogo ? `<img id="h1" style="right:70px" src="${B.homeLogo}">` : '<i id="h1"></i>'}${B.awayLogo ? `<img id="h2" style="left:70px" src="${B.awayLogo}">` : '<i id="h2"></i>'}<div class="n c" style="right:0">${B.home}</div><div class="n c" style="left:0">${B.away}</div><div class="abs t">${B.time}</div><div class="abs tv">${B.tv || ''}</div><div class="abs tag">مباراة اليوم</div>`;
else $('hero').style.display = 'none';
const rows = R.slice(0, PAGES * PER).map((m, i) => {
  const d = document.createElement('div'); d.className = 'abs m'; d.style.top = (Y + (i % PER) * GAP) + 'px'; if (!B) d.style.height = '200px';
  d.innerHTML = `${img(m.homeLogo)}<div class="nm">${m.home}</div><div class="tm"><b>${m.time}</b><i>${m.tv || m.league}</i></div><div class="nm l">${m.away}</div>${img(m.awayLogo)}`;
  $('list').appendChild(d); return d;
});
const more = R.length - rows.length;
const T0 = B ? 2.6 : 1.2, PT = 3.2;
window.TOTAL = T0 + Math.max(1, PAGES) * PT + 2.6;
window.draw = (t) => {
  $('chip').dataset.tf = 'translateX(-50%)'; pop($('chip'), t, 0, .5, -30); pop($('date'), t, .3, .5, -20);
  if (B) {
    const h = back((t - .6) / .7); $('hero').style.opacity = cl((t - .6) / .3); $('hero').style.transform = `scale(${.6 + .4 * h})`;
    $('h1').style.transform = `translateX(${(1 - ease((t - 1) / .6)) * 400}px)`; $('h2').style.transform = `translateX(${(1 - ease((t - 1) / .6)) * -400}px)`;
    document.querySelectorAll('#hero .n,#hero .t,#hero .tv,#hero .tag,#hero .lg').forEach((e, i) => (e.style.opacity = ease((t - 1.4 - i * .12) / .4)));
    $('hero').style.boxShadow = `0 0 ${40 + 30 * Math.sin(t * 4)}px rgba(255,47,151,${.35 * cl((t - 1.5) / .5)})`;
  }
  rows.forEach((r, i) => {
    const pg = Math.floor(i / PER), s = T0 + pg * PT, k = i % PER, last = pg === PAGES - 1;
    const a = ease((t - s - k * .18) / .45), o = last ? 0 : ease((t - s - PT + .45 - k * .06) / .35);
    r.style.opacity = a * (1 - o); r.style.transform = `translateX(${(1 - a) * -300 + o * 300}px)`;
  });
  const p = Math.min(PAGES - 1, Math.max(0, Math.floor((t - T0) / PT)));
  $('pg').textContent = PAGES > 1 ? `صفحة ${p + 1} من ${PAGES}` + (more > 0 && p === PAGES - 1 ? ` • ومباريات أخرى على الموقع` : '') : '';
  $('pg').style.opacity = cl((t - T0) / .4);
  const ce = window.TOTAL - 2.4, k = ease((t - ce) / .6);
  $('list').style.opacity = 1 - k; $('pg').style.opacity = cl((t - T0) / .4) * (1 - k); if (B) $('hero').style.filter = `blur(${k * 8}px)`;
  $('cta').style.opacity = ease((t - ce - .3) / .6); $('cta').style.transform = `scale(${.8 + .2 * back((t - ce - .3) / .6)})`;
};
draw(0);
</script></body></html>
