<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="en.css"><style>
/* FB Legends live boards (owner, 2026-11-11: «اي ماتش هيبدا ... في نفس الوقت يتعملهم ريل بعد الشوط الاول و ريل نهاية
   المباراه بالاحصائيات كاملة ... كل دوري او بطولة بتصميم مختلف عشان فيسبوك ما يفتكرش ان احنا بنستخدم قالب واحد»):
   one page for half-time and full-time, one match or a kick-off group of up to ten, each match with its scorers and
   numbers. DATA.lay picks one of eight looks (rows, tv, cards, led, split, neon, ticket, paper), the competition's
   colours come on top (DATA.theme). */
#cp{top:62px;right:44px;text-align:right;font:700 30px O;letter-spacing:6px;color:var(--kc);z-index:20}
#hl{top:150px;left:44px;right:44px;font:400 140px/0.88 B;letter-spacing:2px;transform:skewX(-6deg);text-shadow:0 6px 30px rgba(0,0,0,.55);z-index:20}
#live{top:112px;right:44px;font:700 32px O;letter-spacing:4px;color:#fff;background:#e11d48;padding:3px 16px;border-radius:10px;display:none;z-index:20}
#list{position:absolute;left:30px;right:30px;z-index:10}
.m{position:relative;margin-bottom:var(--g);opacity:0}
.mt{display:flex;align-items:center;height:var(--h);padding:0 16px;position:relative}
.mt img{width:var(--c);height:var(--c);object-fit:contain;flex:none}
.mt .n{flex:1;font:700 var(--f)/1.05 O;padding:0 14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mt .n.r{text-align:right}
.mt .s{flex:none;width:var(--sw);text-align:center;font:400 var(--sf)/1.12 B;letter-spacing:3px}
.mt .s .w{color:#ffd21f}
.tg{position:absolute;top:4px;left:0;right:0;text-align:center;font:700 var(--tg) O;letter-spacing:2px;color:var(--kc)}
.x{font:500 var(--xf)/1.25 O;color:rgba(255,255,255,.88);padding:6px 22px 10px;opacity:0}
.x .gs{display:flex;justify-content:space-between;gap:20px}.x .gs div{flex:1;min-width:0}.x .gs div+div{text-align:right}
.x .st{display:flex;justify-content:center;gap:26px;margin-top:6px;font:700 calc(var(--xf) * .85) O;letter-spacing:1px;color:var(--kc)}
.x .st b{color:#fff;font-weight:700}
.x .pn{text-align:center;color:#ffd21f;font-weight:700}
.m.big .mt{box-shadow:0 0 40px rgba(255,210,31,.5)}
#tag{position:absolute;right:40px;padding:4px 22px;border-radius:12px;background:#ffd21f;color:var(--dk);font:400 44px B;letter-spacing:2px;opacity:0;z-index:15}
#cta{bottom:48px;font-size:62px}
/* one match: the big score, its goals, its numbers, the best-rated player */
#hero{position:absolute;left:30px;right:30px;top:440px;z-index:10;display:none}
#hero .tm{display:flex;align-items:flex-start;justify-content:space-between;padding:30px 20px 24px;position:relative}
#hero .sd{width:300px;text-align:center}#hero .sd img{width:200px;height:200px;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.55))}
#hero .sd b{display:block;font:700 44px/1.05 O;margin-top:10px}
#hero .sc{flex:1;text-align:center;font:400 230px/1 B;letter-spacing:6px;padding-top:10px}
#hero .ph{position:absolute;top:-6px;left:0;right:0;text-align:center;font:700 32px O;letter-spacing:6px;color:var(--kc)}
#hero .pn{text-align:center;font:700 36px O;color:#ffd21f;margin-top:-10px}
#gl{display:flex;justify-content:space-between;gap:30px;padding:14px 30px;font:500 40px/1.3 O}#gl div{flex:1}#gl div+div{text-align:right}#gl .gm{color:#ffd21f;font-family:B;font-size:46px}
#sb{padding:10px 40px}.sr{margin-bottom:16px;opacity:0}.sr .lb{display:flex;justify-content:space-between;font:400 50px/1 B;letter-spacing:1px}.sr .lb span{font:700 26px O;letter-spacing:3px;color:rgba(255,255,255,.75);align-self:center}
.sr .tr{display:flex;height:18px;gap:8px;margin-top:6px}.sr .tr div{flex:1;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden;display:flex}.sr .tr .b{justify-content:flex-end}.sr i{display:block;height:100%;border-radius:9px;background:var(--kc)}.sr .tr .b i{background:#ffd21f}
#motm{margin:14px 40px 0;text-align:center;font:400 52px B;letter-spacing:2px;background:linear-gradient(90deg,#b45309,#ffd21f);color:#140d02;border-radius:20px;padding:8px;opacity:0}

/* 1 rows: rounded rows on the competition's colours (the Champions League, the Nations League) */
body.L-rows .mt{border-radius:24px;background:rgba(var(--bx),.88);border:2px solid rgba(var(--kl),.3)}
body.L-rows .mt .s{background:var(--b2);border-radius:16px}
body.L-rows .x{background:rgba(var(--bx),.55);border-radius:0 0 20px 20px;margin:0 26px}
body.L-rows #hero .tm{border-radius:30px;background:rgba(var(--bx),.9);border-top:6px solid var(--kc)}

/* 2 tv: a broadcast score bug, sharp and slanted, the headline on a band */
body.L-tv #hl{left:0;right:0;top:170px;padding:16px 44px 10px;background:var(--kc);color:var(--dk);text-shadow:none;transform:skewY(-3deg);font-size:120px}
body.L-tv #hl .y{color:var(--dk);opacity:.7}
body.L-tv .mt{background:#fff;color:#0b0b14;transform:skewX(-10deg);border-left:14px solid var(--kc)}
body.L-tv .mt>*{transform:skewX(10deg)}
body.L-tv .mt .s{background:var(--dk);color:#fff;align-self:stretch;display:flex;align-items:center;justify-content:center}
body.L-tv .mt .s .w{color:var(--kc)}
body.L-tv .tg{color:#0b0b14;opacity:.6;transform:none}
body.L-tv .x{background:rgba(0,0,0,.6);transform:skewX(-10deg);margin:0 18px 0 30px}
body.L-tv .x>*{transform:skewX(10deg)}
body.L-tv #hero .tm{background:#fff;color:#0b0b14;border-left:18px solid var(--kc)}
body.L-tv #hero .ph{color:#0b0b14}

/* 3 cards: crests above the names, each match a card with a coloured top */
body.L-cards #hl{text-align:center;transform:none}
body.L-cards .m{border-radius:28px;background:linear-gradient(180deg,rgba(var(--kl),.22),rgba(var(--bx),.92) 40%);border:3px solid rgba(var(--kl),.55);overflow:hidden}
body.L-cards .mt .s{background:rgba(255,255,255,.1);border-radius:50px}
body.L-cards.few .mt{height:auto;padding:30px 12px 18px;align-items:center}
body.L-cards.few .mt .sd{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
body.L-cards.few .mt .sd .n{flex:none;white-space:normal;text-align:center;padding:0 6px}
body.L-cards #hero .tm{border-radius:34px;background:linear-gradient(180deg,rgba(var(--kl),.25),rgba(var(--bx),.92) 45%);border:3px solid rgba(var(--kl),.55)}

/* 4 led: a stadium scoreboard, dots behind amber figures */
body.L-led .bg{background:#050505 !important}
body.L-led .streak{background:radial-gradient(circle,rgba(255,176,0,.10) 2px,transparent 2.6px) 0 0/14px 14px !important;mix-blend-mode:normal;inset:0}
body.L-led #hl{text-align:center;transform:none;color:#ffb000;text-shadow:0 0 18px rgba(255,176,0,.7);font-size:132px}
body.L-led #hl .y{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.6)}
body.L-led .mt{background:#0d0d0d;border:3px solid #2a2a2a;border-radius:8px}
body.L-led .mt .n{color:#ffe7a8;text-transform:uppercase;letter-spacing:2px}
body.L-led .mt .s{color:#ffb000;text-shadow:0 0 16px rgba(255,176,0,.8);background:#000;border-radius:6px}
body.L-led .mt .s .w{color:#fff}
body.L-led .x{color:#ffd88a}.L-led .x .st{color:#ffb000}
body.L-led #hero .tm{background:#0d0d0d;border:3px solid #2a2a2a;border-radius:10px}
body.L-led #hero .sc{color:#ffb000;text-shadow:0 0 30px rgba(255,176,0,.8)}

/* 5 split: each match cut in two, the home side on the competition's colour */
body.L-split #hl{text-align:right;transform:skewX(6deg)}
body.L-split .mt{background:linear-gradient(105deg,rgba(var(--kl),.32) 0 47%,rgba(255,255,255,.09) 47% 53%,rgba(var(--bx),.92) 53%);border-radius:14px}
body.L-split .mt .s{background:#fff;color:var(--dk);border-radius:50%;width:calc(var(--h) * .82);height:calc(var(--h) * .82);display:flex;align-items:center;justify-content:center;letter-spacing:0;font-size:calc(var(--sf) * .62);margin:0 calc((var(--sw) - var(--h) * .82) / 2)}
body.L-split .mt .s .w{color:var(--dk);text-decoration:underline}
body.L-split .x{border-left:8px solid var(--kc);margin:4px 30px 0}
body.L-split #hero .tm{background:linear-gradient(105deg,rgba(var(--kl),.3) 0 50%,rgba(var(--bx),.92) 50%);border-radius:24px}

/* 6 neon: outlines that glow */
body.L-neon #hl{text-align:center;transform:none;color:transparent;-webkit-text-stroke:3px #fff;text-shadow:0 0 22px var(--kc)}
body.L-neon #hl .y{-webkit-text-stroke:3px var(--kc);color:transparent}
body.L-neon .mt{border:3px solid var(--kc);border-radius:60px;box-shadow:0 0 18px rgba(var(--kl),.55),inset 0 0 18px rgba(var(--kl),.25);background:rgba(0,0,0,.35)}
body.L-neon .mt .s{color:var(--kc);text-shadow:0 0 14px var(--kc)}
body.L-neon .mt .s .w{color:#fff}
body.L-neon #hero .tm{border:3px solid var(--kc);border-radius:40px;box-shadow:0 0 30px rgba(var(--kl),.5)}
body.L-neon #hero .sc{color:var(--kc);text-shadow:0 0 24px var(--kc)}

/* 7 ticket: each match a match ticket, the score on its stub */
body.L-ticket #hl{transform:rotate(-3deg)}
body.L-ticket .mt{background:#f6eedb;color:#1d1608;border-radius:10px;-webkit-mask:radial-gradient(circle at calc(100% - var(--sw) - 16px) 0,transparent 14px,#000 15px) top/100% 51% no-repeat,radial-gradient(circle at calc(100% - var(--sw) - 16px) 100%,transparent 14px,#000 15px) bottom/100% 51% no-repeat}
body.L-ticket .mt .s{order:9;border-left:4px dashed #b9a982;color:#1d1608;margin-left:16px}
body.L-ticket .mt .s .w{color:#c2410c}
body.L-ticket .mt .n.r{text-align:left}
body.L-ticket .mt .n:first-of-type::after{content:' v';color:#9a8a62}
body.L-ticket .tg{color:#9a6a12;text-align:left;padding-left:30px}
body.L-ticket .x{color:#fff}
body.L-ticket #hero .tm{background:#f6eedb;color:#1d1608;border-radius:16px}
body.L-ticket #hero .sc .w,body.L-ticket #hero .sc{color:#1d1608}body.L-ticket #hero .ph{color:#9a6a12}

/* 8 paper: a newspaper's results page, black on cream */
body.L-paper{background:#efe9da !important}
body.L-paper .bg,body.L-paper .streak{display:none}
body.L-paper .logo{color:#111}body.L-paper .logo i{color:#b91c1c}
body.L-paper #cp{color:#7c2d12}
body.L-paper #hl{color:#111;text-align:center;transform:none;text-shadow:none;border-top:6px solid #111;border-bottom:2px solid #111;padding:10px 0 4px;font-size:128px}
body.L-paper #hl .y{color:#b91c1c}
body.L-paper .m{border-bottom:2px solid rgba(0,0,0,.35)}
body.L-paper .mt{color:#111}
body.L-paper .mt .s{color:#111}body.L-paper .mt .s .w{color:#b91c1c}
body.L-paper .tg{color:#7c2d12}
body.L-paper .x{color:#2d2a22}body.L-paper .x .st{color:#7c2d12}body.L-paper .x .st b{color:#111}
body.L-paper .m.big .mt{box-shadow:none;background:rgba(185,28,28,.1)}
body.L-paper #cta{color:#b91c1c;text-shadow:none}
body.L-paper #hero{color:#111}body.L-paper #hero .tm{border-top:4px solid #111;border-bottom:4px solid #111}
body.L-paper #hero .ph,body.L-paper #gl .gm{color:#b91c1c}body.L-paper .sr .lb span{color:#555}body.L-paper .sr .tr div{background:rgba(0,0,0,.12)}body.L-paper .sr i{background:#111}body.L-paper .sr .tr .b i{background:#b91c1c}
</style></head><body><div class="bg"></div><div class="streak"></div><div class="logo">FB<i>LEGENDS</i></div>
<div class="abs" id="cp"></div><div class="abs" id="hl"></div><div class="abs" id="live">● LIVE</div><div id="list"></div><div id="hero"></div><div id="tag"></div><div class="cta" id="cta"></div>
<script src="lib.js"></script><script src="en-lib.js"></script><script>
const D = window.DATA, M = (D.rows || []).slice(0, 10), n = M.length, LAY = /^(rows|tv|cards|led|split|neon|ticket|paper)$/.test(D.lay) ? D.lay : 'rows';
document.body.classList.add('L-' + LAY);
const esc = (s) => String(s == null ? '' : s).replace(/[<&]/g, (c) => (c === '<' ? '&lt;' : '&amp;'));
$('hl').innerHTML = `${esc(D.h1 || 'HALF-TIME')}<br><span class="y">${esc(D.h2 || 'SCORES')}</span>`;
$('cp').textContent = (D.league || '').toUpperCase(); if (D.live) $('live').style.display = 'block';
$('tag').textContent = D.bigLabel || 'BIGGEST WIN'; $('cta').textContent = D.cta || 'WHAT DID YOU MAKE OF IT? 👇';
const crest = (u) => `<img src="${u || ''}" ${u ? '' : 'style="visibility:hidden"'}>`;
const sc = (m) => `<span class="${m.hs > m.as ? 'w' : ''}">${m.hs}</span>-<span class="${m.as > m.hs ? 'w' : ''}">${m.as}</span>`;
const goals = (g) => (g || []).map((x) => `${esc(x.n)} ${esc(x.m)}'${x.pen ? ' (P)' : ''}${x.og ? ' (OG)' : ''}`);
const short = (g, full) => { const c = new Map(); for (const x of g || []) { const k = esc(full ? x.n : String(x.n).split(/\s+/).pop()) + (x.og ? ' (OG)' : '') + (x.pen ? ' (P)' : ''); c.set(k, [...(c.get(k) || []), `${esc(x.m)}'`]); } return [...c].map(([k, v]) => `${k} ${v.join(' ')}`).join(', '); };
const statTxt = (st) => (st || []).map(([l, a, b, u]) => `${esc(l)} <b>${esc(a)}${u || ''}-${esc(b)}${u || ''}</b>`).join('<span>•</span>');
let rows = [], xs = [], LT = 440, h = 0, gap = 0;
if (n === 1) {
  // One match (a lone kick-off with a big side): the score, the goals side by side, the numbers as bars, the best-rated player.
  const m = M[0], hero = $('hero'); hero.style.display = 'block';
  const gh = goals(m.goals?.filter((x) => x.s === 'h')), ga = goals(m.goals?.filter((x) => x.s === 'a'));
  const bar = ([l, a, b, u]) => { const A = Number(a) || 0, B = Number(b) || 0, t = A + B || 1;
    return `<div class="sr"><div class="lb"><b>${esc(a)}${u || ''}</b><span>${esc(l)}</span><b>${esc(b)}${u || ''}</b></div><div class="tr"><div class="b"><i data-w="${100 * A / t}"></i></div><div><i data-w="${100 * B / t}"></i></div></div></div>`; };
  hero.innerHTML = `<div class="tm"><span class="ph">${esc(m.tag || '')}</span><div class="sd">${crest(m.homeLogo)}<b>${esc(m.home)}</b></div><div class="sc">${sc(m)}</div><div class="sd">${crest(m.awayLogo)}<b>${esc(m.away)}</b></div></div>`
    + (m.pens ? `<div class="pn">${esc(m.pens)}</div>` : '')
    + (gh.length || ga.length ? `<div id="gl"><div>${gh.map((x) => `<div class="g">⚽ ${x.replace(/(\d+\+?\d*)'/, '<span class="gm">$1\'</span>')}</div>`).join('')}</div><div>${ga.map((x) => `<div class="g">${x.replace(/(\d+\+?\d*)'/, '<span class="gm">$1\'</span>')} ⚽</div>`).join('')}</div></div>` : '')
    + `<div id="sb">${(m.stats || []).slice(0, 4).map(bar).join('')}</div>` + (m.motm ? `<div id="motm">⭐ TOP RATED: ${esc(m.motm.name)} ${esc(m.motm.rating)}</div>` : '');
  hero.style.top = (440 + Math.max(0, Math.round((1280 - hero.offsetHeight) / 2))) + 'px'; // centred between the headline and the question
  const gs = [...hero.querySelectorAll('.g')], srs = [...hero.querySelectorAll('.sr')], bars = [...hero.querySelectorAll('.sr i')], mo = $('motm');
  const TG = 1.1, TS = TG + gs.length * .35 + .4, TM = TS + srs.length * .45 + .3, TC = TM + (mo ? 1 : .2);
  window.TOTAL = Math.max(9, TC + 3.2);
  window.draw = (t) => {
    const a = ease(t / .35); hero.querySelector('.tm').style.transform = `scale(${.9 + .1 * a})`; hero.style.opacity = a;
    hero.querySelector('.sc').style.transform = `scale(${1 + .05 * Math.max(0, Math.sin(t * 2.4))})`;
    gs.forEach((g, i) => { const k = ease((t - TG - i * .35) / .3); g.style.opacity = k; g.style.transform = `translateY(${(1 - k) * 30}px)`; });
    srs.forEach((s, i) => { s.style.opacity = ease((t - TS - i * .45) / .3); });
    bars.forEach((b) => { const i = srs.indexOf(b.closest('.sr')); b.style.width = (Number(b.dataset.w) * ease((t - TS - i * .45 - .15) / .6)) + '%'; });
    if (mo) { const k = ease((t - TM) / .4); mo.style.opacity = k; mo.style.transform = `scale(${t > TM ? 1.15 - .15 * back((t - TM) / .6) : .9})`; }
    $('hl').style.transform = LAY === 'tv' ? 'skewY(-3deg)' : $('hl').style.transform;
    if (D.live) $('live').style.opacity = .55 + .45 * Math.abs(Math.sin(t * 3));
    const k2 = ease((t - TC) / .5); $('cta').style.opacity = k2; $('cta').style.transform = `scale(${t > TC ? 1.25 - .25 * back((t - TC) / .6) : 1})`;
  };
  window.POSTER = Math.min(window.TOTAL - .3, TC - .1);
} else {
  // A kick-off group: a row a match, its scorers under it, its numbers too when there is room (four matches or fewer).
  const few = n <= 4; if (few) document.body.classList.add('few');
  h = n > 8 ? 84 : n > 6 ? 96 : n > 4 ? 112 : n > 2 ? 140 : 190; gap = n > 8 ? 8 : n > 6 ? 10 : n > 4 ? 14 : n > 2 ? 22 : 34;
  const xf = n > 8 ? 22 : n > 6 ? 24 : n > 4 ? 26 : n > 2 ? 30 : 34;
  document.documentElement.style.cssText = `--h:${h}px;--g:${gap}px;--c:${Math.round(h * (few ? .5 : .62))}px;--f:${n > 8 ? 32 : n > 4 ? 36 : n > 2 ? 40 : 46}px;--sf:${n > 8 ? 66 : n > 4 ? 76 : n > 2 ? 96 : 120}px;--sw:${n > 4 ? 190 : 250}px;--tg:${n > 4 ? 18 : 22}px;--xf:${xf}px`;
  $('list').innerHTML = M.map((m) => {
    const side = (u, nm, r) => (few && LAY === 'cards' ? `<span class="sd">${crest(u)}<span class="n">${esc(nm)}</span></span>` : r ? `<span class="n r">${esc(nm)}</span>${crest(u)}` : `${crest(u)}<span class="n">${esc(nm)}</span>`);
    const gh = short(m.goals?.filter((x) => x.s === 'h'), few), ga = short(m.goals?.filter((x) => x.s === 'a'), few);
    const x = (gh || ga ? `<div class="gs"><div>${gh ? '⚽ ' + gh : ''}</div><div>${ga ? ga + ' ⚽' : ''}</div></div>` : '') + (m.pens ? `<div class="pn">${esc(m.pens)}</div>` : '') + (few && m.stats?.length ? `<div class="st">${statTxt(m.stats.slice(0, 3))}</div>` : '');
    return `<div class="m"><div class="mt">${side(m.homeLogo, m.home)}<span class="s">${sc(m)}</span>${side(m.awayLogo, m.away, true)}${m.tag && m.tag !== D.h1 && LAY !== 'paper' ? `<span class="tg">${esc(m.tag)}</span>` : ''}</div>${x ? `<div class="x">${x}</div>` : ''}</div>`;
  }).join('');
  rows = [...document.querySelectorAll('.m')]; xs = rows.map((r) => r.querySelector('.x'));
  const tot = rows.reduce((a, r) => a + r.offsetHeight, 0) + gap * (n - 1), room = 1300;
  if (tot > room) { const k = room / tot; $('list').style.transform = `scale(${k})`; $('list').style.transformOrigin = '50% 0'; }
  LT = 440 + Math.max(0, Math.round((room - Math.min(room, tot)) / 2)); $('list').style.top = LT + 'px';
  let bi = -1, bm = 0; M.forEach((m, i) => { const d = Math.abs(m.hs - m.as); if (d > bm) { bm = d; bi = i; } });
  const T1 = .8, PER = n > 6 ? .38 : .5, TB = T1 + n * PER + .5, TX = TB + .2, TC = TB + 1.6;
  window.TOTAL = Math.max(9.5, TC + 3.4);
  // each look its own entrance
  const enter = (r, i, a) => {
    if (LAY === 'tv') { r.style.clipPath = `inset(0 ${(1 - a) * 100}% 0 0)`; r.style.opacity = a > 0 ? 1 : 0; }
    else if (LAY === 'cards') { r.style.opacity = a; r.style.transform = `scale(${.7 + .3 * back(a)})`; }
    else if (LAY === 'led') { r.style.opacity = a >= 1 ? 1 : (Math.floor(a * 8) % 2 ? .9 : .15) * (a > 0); }
    else if (LAY === 'split') { r.style.opacity = a; r.style.transform = `translateX(${(1 - a) * (i % 2 ? 160 : -160)}px)`; }
    else if (LAY === 'neon') { r.style.opacity = a >= 1 ? 1 : a * (.6 + .4 * Math.abs(Math.sin(a * 40))); }
    else if (LAY === 'ticket') { r.style.opacity = a; r.style.transform = `translateY(${(1 - a) * -90}px) rotate(${(1 - a) * (i % 2 ? 4 : -4)}deg)`; }
    else if (LAY === 'paper') { r.style.opacity = a; r.style.transform = `translateY(${(1 - a) * 40}px)`; }
    else { r.style.opacity = a; r.style.transform = `translateX(${(1 - a) * (i % 2 ? 120 : -120)}px)`; }
  };
  window.draw = (t) => {
    rows.forEach((r, i) => enter(r, i, ease((t - (i < 2 ? -1 : T1 + (i - 2) * PER)) / .35)));
    xs.forEach((x, i) => { if (x) x.style.opacity = ease((t - Math.max(i < 2 ? .3 : T1 + (i - 2) * PER + .3, 0)) / .4); });
    if (LAY !== 'tv') $('hl').style.transform = `${LAY === 'split' ? 'skewX(6deg)' : LAY === 'ticket' ? 'rotate(-3deg)' : /^(cards|led|neon|paper)$/.test(LAY) ? '' : 'skewX(-6deg)'} translateX(${(1 - ease(t / .4)) * -50}px)`;
    if (bi >= 0) { const k = ease((t - TX) / .4), r = rows[bi]; r.classList.toggle('big', t > TX); if (t > TX && LAY !== 'tv') r.style.transform = `scale(${1 + .03 * k})`;
      $('tag').style.opacity = k * (1 - ease((t - TX - 2.6) / .3)); const sk = Number(($('list').style.transform.match(/scale\(([\d.]+)\)/) || [])[1]) || 1;
      $('tag').style.top = (LT + r.offsetTop * sk - 34) + 'px'; }
    if (D.live) $('live').style.opacity = .55 + .45 * Math.abs(Math.sin(t * 3));
    const k2 = ease((t - TC) / .5); $('cta').style.opacity = k2; $('cta').style.transform = `scale(${t > TC ? 1.25 - .25 * back((t - TC) / .6) : 1})`;
  };
  window.POSTER = Math.min(window.TOTAL - .3, TC - .2);
}
progBar();
draw(0);
</script></body></html>
