# One-off (owner, 2026-11-17): Commons photo candidates for the rules episodes, to be checked by eye.
name: Rules photos probe
on:
  push:
    branches: [viral-probe]
    paths: [probe/commons.py, .github/workflows/viral.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 probe/commons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe; git commit -m "Rules photos probe result" || exit 0
          for t in 1 2 3; do git push && break; sleep $((t * 5)); done
