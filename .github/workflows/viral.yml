# One-off trial (owner, 2026-11-17): the site's viral radar run now, without sending (/v2/ytviral/dry).
name: Viral radar trial
on:
  push:
    branches: [viral-probe]
    paths: [.github/workflows/viral.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dry run
        env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          set -uo pipefail
          for t in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -G -o probe/dry.json -w '%{http_code}' --max-time 400 "https://api.football-legend.com/v2/ytviral/dry" --data-urlencode "key=$REELS_KEY" || echo 000)
            echo "try $t: HTTP $code"; head -c 300 probe/dry.json; echo
            [ "$code" = "200" ] && break; sleep 60
          done
      - name: Keep the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/dry.json; git commit -m "Viral radar dry run" || exit 0
          for t in 1 2 3; do git push && break; sleep $((t * 5)); done
