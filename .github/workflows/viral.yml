# One-off trial (owner, 2026-11-17): can a runner find viral football Shorts and analyse them with OpenMontage?
name: Viral radar trial
on:
  push:
    branches: [viral-probe]
    paths: [probe/run.py, .github/workflows/viral.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          git clone -q --depth 1 https://github.com/OpenMontageInc/OpenMontage.git
          pip install -q -U yt-dlp faster-whisper opencv-python-headless scenedetect numpy pyyaml pydantic jsonschema requests pillow
      - name: Find and analyse
        continue-on-error: true
        run: python3 probe/run.py 2>&1 | tail -150
      - name: Keep the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/result.json probe/out 2>/dev/null; git commit -m "Viral radar trial result" || exit 0
          for t in 1 2 3; do git push && break; sleep $((t * 5)); done
