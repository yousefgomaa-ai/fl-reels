# One-off sample of an AI series episode (owner, 2026-11-11). Lives on claude/series-sample only; never merge.
name: Series sample
on:
  push:
    branches: [claude/series-sample]
    paths: [series/story.json, series/make_episode.py, .github/workflows/series-sample.yml]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - run: pip install -q edge-tts pillow
      - run: python3 series/make_episode.py
      - run: |
          mkdir -p series/frames && cp series/out/img*.jpg series/frames/
          git config user.name "series-sample" && git config user.email "actions@users.noreply.github.com"
          git add series/episode1.mp4 series/frames
          git commit -m "Series sample: episode 1 video [skip ci]" && git push
