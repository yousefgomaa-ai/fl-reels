name: photos-probe
on:
  push:
    branches: [photos-probe]
    paths: [probe/picks.json, probe/fetch.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 probe/fetch.py
      - run: |
          git config user.name "fl-reels bot"; git config user.email "actions@users.noreply.github.com"
          git add probe/check && git commit -qm "Picked photos checked" || exit 0
          for t in 1 2 3 4; do git push && break; sleep $((t * 5)); done
