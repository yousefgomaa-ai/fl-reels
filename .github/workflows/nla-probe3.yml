# One-off (owner, 2026-11-14): run the quotes desk once after the API's deploy and print its reasons. Never merged.
name: NLA probe 3
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe3.yml, sample/m.py]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        shell: bash
        run: |
          echo "::add-mask::$REELS_KEY"
          sleep 1
          for d in 20261124 20261125; do curl -sS --max-time 60 "https://api.football-legend.com/matches?date=$d" -o m$d.json; done
          python3 sample/m.py
