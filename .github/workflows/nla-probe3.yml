# One-off (owner, 2026-11-14): run the quotes desk once after the API's deploy and print its reasons. Never merged.
name: NLA probe 3
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe3.yml, sample/gn.py]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        shell: bash
        run: |
          echo "::add-mask::$REELS_KEY"
          sleep 2
          curl -sS --max-time 120 -G "https://api.football-legend.com/v2/social/check" --data-urlencode "key=$REELS_KEY" -o r.json || echo "no answer"
          python3 -c "import json;d=json.load(open('r.json'));print(json.dumps(d,ensure_ascii=False,indent=1)[:5000])" || head -c 2000 r.json
