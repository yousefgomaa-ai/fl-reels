# One-off (owner, 2026-11-14): run the quotes desk once after the API's deploy and print its reasons. Never merged.
name: NLA probe 3
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe3.yml, sample/gn.py]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        shell: bash
        run: |
          echo "::add-mask::$REELS_KEY"
          sleep 5
          curl -sS --max-time 400 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "kinds=none" --data-urlencode "special=month-uefa.champions" -o r.json || echo "no answer"
          python3 -c "import json;d=json.load(open('r.json'));print(json.dumps(d['result'].get('special'),ensure_ascii=False)[:3000]);j=[x for x in d.get('jobs') or [] if 'month' in str(x.get('id',''))];print(json.dumps(j,ensure_ascii=False)[:3000])" || head -c 1500 r.json
