# One-off (owner, 2026-11-13: a live results stream): the shape of today's live list. Never merged.
name: NLA probe 3
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe3.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS --max-time 60 "https://api.football-legend.com/matches?date=$(date -u +%Y%m%d)" -o m.json
          python3 - <<'PY'
          import json
          d=json.load(open('m.json'))
          print(type(d).__name__, list(d.keys())[:20] if isinstance(d,dict) else len(d))
          def walk(o,depth=0):
            if isinstance(o,dict):
              for k,v in o.items():
                if isinstance(v,(dict,list)): print('  '*depth+k+':',type(v).__name__, len(v)); 
                if depth<1: walk(v,depth+1)
          walk(d)
          s=json.dumps(d)
          i=s.find('uefa.nations'); print(s[max(0,i-200):i+2500])
          PY
