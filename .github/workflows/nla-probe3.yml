# One-off (owner, 2026-11-14): run the quotes desk once after the API's deploy and print its reasons. Never merged.
name: NLA probe 3
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe3.yml, sample/gn.py]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        shell: bash
        run: |
          echo "::add-mask::$REELS_KEY"
          sleep 2
          curl -sS --max-time 120 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "kinds=none" --data-urlencode "state=en-rsched-superlig-20261121" -o r.json || echo "no answer"
          python3 -c "import json;d=json.load(open('r.json'))['result'];print(json.dumps(d.get('state'),ensure_ascii=False)[:1200])" || head -c 800 r.json
          curl -sS --max-time 120 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "kinds=none" --data-urlencode "state=en-rsched-superlig-20261122" -o r.json || echo "no answer"
          python3 -c "import json;d=json.load(open('r.json'))['result'];print(json.dumps(d.get('state'),ensure_ascii=False)[:1200])" || head -c 800 r.json
          curl -sS --max-time 120 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "kinds=none" --data-urlencode "state=en-rsched-superlig-20261120" -o r.json || echo "no answer"
          python3 -c "import json;d=json.load(open('r.json'))['result'];print(json.dumps(d.get('state'),ensure_ascii=False)[:1200])" || head -c 800 r.json
          curl -sS --max-time 300 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "kinds=round" -o r2.json || echo "no answer"
          python3 -c "import json;d=json.load(open('r2.json'));print(json.dumps([{k:j.get(k) for k in ('id','title','until')} for j in d.get('jobs') or []],ensure_ascii=False)[:3000]);print(str(d.get('result'))[:800])" || head -c 1500 r2.json
