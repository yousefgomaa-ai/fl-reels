# One-off (owner, 2026-11-14): post the Salah v Hossam Hassan news (photo card now, explainer reel after it), after the API's deploy. Never merged.
name: NLA probe 3
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe3.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        shell: bash
        run: |
          echo "::add-mask::$REELS_KEY"
          sleep 210
          curl -sS --max-time 400 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "kinds=none" --data-urlencode "arspecial=salah-hossam" -o r.json || echo "no answer"
          python3 -c "import json;d=json.load(open('r.json'));print(json.dumps((d.get('result') or d).get('arspecial'), ensure_ascii=False))" || head -c 500 r.json
