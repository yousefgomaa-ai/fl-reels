# One-off (owner, 2026-11-13): Egypt's next game and the Nations League days, for the live board. Never merged.
name: NLA probe 3
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe3.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          for d in 20261113 20261114 20261115 20261116 20261117 20261118 20261119; do
            curl -sS --max-time 60 "https://api.football-legend.com/matches?date=$d" -o m.json || continue
            python3 -c "
          import json;d=json.load(open('m.json'))
          for e in d.get('events',[]):
            h,a=e['teams']['home']['name'],e['teams']['away']['name']
            if 'Egypt' in (h,a) or e.get('leagueSlug')=='uefa.nations': print('$d',e.get('leagueSlug'),e['fixture']['date'],h,'v',a,e['fixture']['status'].get('state'))
          "
          done
