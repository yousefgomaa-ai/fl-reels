# One-off (2026-11-03): draws every moving reel kind on a runner the way reels.yml does, and keeps the results here.
name: Anim test
on:
  push:
    branches: [anim-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Install Playwright
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          timeout 300 npx playwright install --with-deps chromium
      - name: Draw every kind
        run: node test/run.mjs
      - name: Keep the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test/out && git commit -qm "Anim test results" && git push || true
