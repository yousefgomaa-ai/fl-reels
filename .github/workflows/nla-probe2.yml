# One-off (owner, 2026-11-13): the approved Premier League managers reel, dropped when Facebook could not fetch it, put
# back (it is uploaded as a file now). Never merged.
name: NLA probe 2
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe2.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        shell: bash
        run: |
          echo "::add-mask::$REELS_KEY"
          curl -sS --max-time 400 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "kinds=none" --data-urlencode "repost=en-special-coaches-pl-1" -o r.json || echo "no answer"
          python3 -c "import json;d=json.load(open('r.json'));print(json.dumps((d.get('result') or {}).get('repost')))" || head -c 300 r.json
