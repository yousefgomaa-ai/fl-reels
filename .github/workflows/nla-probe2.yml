# One-off (owner, 2026-11-13): the Premier League managers reel again, after the other four (its first call came before the
# API was deployed). Never merged.
name: NLA probe 2
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe2.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          echo "::add-mask::$REELS_KEY"
          curl -sS --max-time 60 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "special=coaches-zz" | python3 -c "import json,sys;d=json.load(sys.stdin);print('check', json.dumps((d.get('result') or {}).get('special')))"
          sleep 4000
          curl -sS --max-time 120 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "special=coaches-pl" | python3 -c "import json,sys;d=json.load(sys.stdin);print('pl', json.dumps((d.get('result') or {}).get('special')))"
