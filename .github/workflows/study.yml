# Channel study: publish times of the reference Shorts channel.
name: Shorts channel study
on:
  push:
    branches: [main]
    paths: [study/schedule.py, .github/workflows/study.yml]
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q -U yt-dlp
      - run: python3 study/schedule.py "@sticktoit-q4d" study/schedule.json
      - name: Commit
        run: |
          git config user.name "study" && git config user.email "actions@users.noreply.github.com"
          git add study/schedule.json && git commit -m "Channel study: publish times [skip ci]" && git pull -q --rebase origin main && git push || true
