# Fetch the last output of a Kaggle kernel without running it again (2026-11-12). Never merge.
name: Series fetch
on:
  push:
    branches: [claude/series-sample]
    paths: [.github/workflows/series-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "kaggle>=1.8"
      - run: |
          mkdir -p series/lipsync/out && kaggle kernels output "$KAGGLE_USERNAME/series-lipsync" -p series/lipsync/out
          rm -f series/lipsync/out/*.log; ls -la series/lipsync/out
          git config user.name "series-sample" && git config user.email "actions@users.noreply.github.com"
          git add series/lipsync/out && git commit -m "Series sample: lip-sync shots [skip ci]" && git pull -q --rebase origin claude/series-sample && git push
