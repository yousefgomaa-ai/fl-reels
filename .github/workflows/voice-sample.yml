# A one-off sample: the reel's narration read by Gemini's voices through the site's API (it holds the Gemini key),
# for the owner to listen to and choose (2026-10-28).
name: Voice sample
on:
  push:
    branches: [voice-sample]
    paths: [sample/gemini.txt, sample/puck.txt, sample/photo.txt, sample/logos.txt, sample/whole.txt, sample/accent.json, sample/players.txt, sample/photos.txt, 'sample/career/**', sample/careers.py]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Read the narration with each voice
        env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          set -uo pipefail
          style='Read this in Modern Standard Arabic like an energetic, passionate Arab football commentator on TV: natural and human, lively pace, rising excitement on the goals, a short pause between sentences.'
          text=$(cat sample/gemini.txt)
          [ -n "$(git diff --name-only HEAD~1 HEAD -- sample/gemini.txt)" ] || exit 0
          for v in Charon Fenrir Orus Puck; do
            code=$(curl -sS -G -o "sample/g-$v.wav" -w '%{http_code}' --max-time 120 "https://api.football-legend.com/v2/reels/voice" \
              --data-urlencode "key=$REELS_KEY" --data-urlencode "voice=$v" --data-urlencode "style=$style" --data-urlencode "text=$text")
            echo "$v: HTTP $code"
            if [ "$code" = "200" ]; then ffmpeg -loglevel error -y -i "sample/g-$v.wav" -b:a 128k "sample/g-$v.mp3"; else cat "sample/g-$v.wav"; echo; fi
            rm -f "sample/g-$v.wav"
          done
          ls -la sample
      - name: Puck, one sentence at a time, calm
        if: hashFiles('sample/puck.txt') != ''
        env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          set -uo pipefail
          style=''
          i=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            i=$((i+1))
            for t in 1 2 3; do
              code=$(curl -sS -G -o "sample/p-$i.wav" -w '%{http_code}' --max-time 120 "https://api.football-legend.com/v2/reels/voice" \
                --data-urlencode "key=$REELS_KEY" --data-urlencode "voice=Puck" --data-urlencode "lang=ar-EG" --data-urlencode "style=$style" --data-urlencode "text=$line" || echo 000)
              [ "$code" = "200" ] && break
              echo "line $i try $t: HTTP $code"; sleep 15
            done
            echo "line $i: HTTP $code"
            if [ "$code" = "200" ]; then ffmpeg -loglevel error -y -i "sample/p-$i.wav" -b:a 128k "sample/p-$i.mp3"; else cat "sample/p-$i.wav"; echo; fi
            rm -f "sample/p-$i.wav"
            sleep 8
          done < sample/puck.txt
      - name: The whole narration in one reading (one voice from start to end)
        if: hashFiles('sample/whole.txt') != ''
        env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          set -uo pipefail
          body=$(python3 -c "import json;l=[x.strip() for x in open('sample/whole.txt') if x.strip()];print(json.dumps({'text':'\n\n'.join(l),'voice':'Puck','lang':'ar-EG'}))")
          echo "body bytes: ${#body}"; echo "$body" | head -c 120; echo
          echo "$body" > /tmp/body.json
          st=$(python3 -c "import urllib.parse;print(urllib.parse.quote(open('sample/whole-style.txt').read().strip(),safe=''))" 2>/dev/null || true)
          for try in 1 2 3; do
            code=$(curl -sS -o sample/whole.wav -w '%{http_code}' --max-time 240 -X POST -H 'Content-Type: application/json' \
              --data-binary @/tmp/body.json "https://api.football-legend.com/v2/reels/voice?key=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["REELS_KEY"],safe=""))')&voice=Puck&lang=ar-EG&style=$st" || echo 000)
            [ "$code" = "200" ] && break; echo "try $try: HTTP $code"; head -c 300 sample/whole.wav; echo; sleep 20
          done
          echo "whole: HTTP $code"
          if [ "$code" = "200" ]; then ffmpeg -loglevel error -y -i sample/whole.wav -b:a 160k sample/whole.mp3; ffprobe -v error -show_entries format=duration -of csv=p=0 sample/whole.mp3; else cat sample/whole.wav; fi
          rm -f sample/whole.wav
          pip install -q faster-whisper
          python3 - <<'PY'
          import subprocess, json
          import numpy as np
          from faster_whisper import WhisperModel
          pcm = subprocess.run(['ffmpeg', '-loglevel', 'error', '-i', 'sample/whole.mp3', '-f', 'f32le', '-ac', '1', '-ar', '16000', '-'], capture_output=True, check=True).stdout
          m = WhisperModel('small', device='cpu', compute_type='int8')
          segs, info = m.transcribe(np.frombuffer(pcm, np.float32), language='ar', word_timestamps=True)
          out = []
          for s in segs:
              out.append({'s': round(s.start, 2), 'e': round(s.end, 2), 't': s.text.strip(), 'w': [[round(w.start, 2), w.word.strip()] for w in (s.words or [])]})
              print(round(s.start, 2), round(s.end, 2), s.text.strip())
          json.dump(out, open('sample/whole.json', 'w'), ensure_ascii=False)
          PY
      - name: Accent tries (owner, 2026-10-28, the Egyptian accent of the Liverpool part)
        if: hashFiles('sample/accent.json') != ''
        env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          set -uo pipefail
          k=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["REELS_KEY"],safe=""))')
          n=$(python3 -c "import json;print(len(json.load(open('sample/accent.json'))))")
          for i in $(seq 0 $((n-1))); do
            name=$(python3 -c "import json;print(json.load(open('sample/accent.json'))[$i]['name'])")
            python3 -c "import json;v=json.load(open('sample/accent.json'))[$i];print(json.dumps({'text':v['text']}))" > /tmp/b.json
            st=$(python3 -c "import json,urllib.parse;print(urllib.parse.quote(json.load(open('sample/accent.json'))[$i]['style'],safe=''))")
            for try in 1 2 3; do
              code=$(curl -sS -o /tmp/a.wav -w '%{http_code}' --max-time 240 -X POST -H 'Content-Type: application/json' --data-binary @/tmp/b.json "https://api.football-legend.com/v2/reels/voice?key=$k&voice=Puck&lang=ar-EG&style=$st" || echo 000)
              [ "$code" = "200" ] && break; echo "$name try $try: HTTP $code"; head -c 200 /tmp/a.wav; echo; sleep 15
            done
            [ "$code" = "200" ] && ffmpeg -loglevel error -y -i /tmp/a.wav -b:a 160k "sample/acc-$name.mp3"
          done
          pip install -q faster-whisper
          python3 - <<'PY2'
          import glob, subprocess
          import numpy as np
          from faster_whisper import WhisperModel
          m = WhisperModel('small', device='cpu', compute_type='int8')
          for f in sorted(glob.glob('sample/acc-*.mp3')):
              pcm = subprocess.run(['ffmpeg', '-loglevel', 'error', '-i', f, '-f', 'f32le', '-ac', '1', '-ar', '16000', '-'], capture_output=True, check=True).stdout
              segs, _ = m.transcribe(np.frombuffer(pcm, np.float32), language='ar')
              print('==', f, round(len(pcm) / 64000, 1), 's')
              for s in segs: print('  ', round(s.start, 1), s.text.strip())
          PY2
      - name: Write down what each clip says (to check nothing extra is read)
        if: hashFiles('sample/p-1.mp3') != ''
        continue-on-error: true
        run: |
          pip install -q faster-whisper
          python3 - <<'PY'
          import glob, subprocess
          import numpy as np
          from faster_whisper import WhisperModel
          m = WhisperModel('small', device='cpu', compute_type='int8')
          for f in sorted(glob.glob('sample/p-*.mp3')):
              pcm = subprocess.run(['ffmpeg', '-loglevel', 'error', '-i', f, '-f', 'f32le', '-ac', '1', '-ar', '16000', '-'], capture_output=True, check=True).stdout
              segs, info = m.transcribe(np.frombuffer(pcm, np.float32), language=None)
              print(f, info.language, '|', ' '.join(s.text.strip() for s in segs))
          PY
      - name: The photo from Wikimedia Commons, with its author and licence
        if: hashFiles('sample/photo.txt') != ''
        run: |
          set -euo pipefail
          t=$(head -1 sample/photo.txt)
          curl -sS -G "https://commons.wikimedia.org/w/api.php" -A "FootballLegends/1.0 (football-legend.com)" \
            --data-urlencode action=query --data-urlencode format=json --data-urlencode prop=imageinfo \
            --data-urlencode "iiprop=url|extmetadata" --data-urlencode iiurlwidth=1080 --data-urlencode "titles=$t" > sample/photo.json
          u=$(jq -r '.query.pages[].imageinfo[0].thumburl' sample/photo.json)
          curl -sS -L -A "FootballLegends/1.0 (football-legend.com)" -o sample/photo.jpg "$u"
          jq -r '.query.pages[].imageinfo[0].extmetadata | "\(.Artist.value) | \(.LicenseShortName.value)"' sample/photo.json
      - name: Club logos
        if: hashFiles('sample/logos.txt') != ''
        run: |
          for id in $(cat sample/logos.txt); do curl -sS -A "Mozilla/5.0" -o "sample/logo-$id.png" "https://images.fotmob.com/image_resources/logo/teamlogo/$id.png"; file "sample/logo-$id.png"; done
      - name: Player facts and photos (FotMob career, logos, Commons candidates)
        if: hashFiles('sample/players.txt') != ''
        continue-on-error: true
        run: python3 sample/research.py
      - name: Photos for the scenes (Commons, 1080 px, with credits)
        if: hashFiles('sample/photos.txt') != ''
        continue-on-error: true
        run: python3 sample/photos.py
      - name: Career videos (voice in one reading, scene photos), only what is missing
        if: hashFiles('sample/career/**') != ''
        continue-on-error: true
        env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          pip install -q faster-whisper
          python3 sample/careers.py
      - name: Keep the audio on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample/pl 2>/dev/null || true; git add sample/career 2>/dev/null || true; git add sample/ph 2>/dev/null || true; git add sample/acc-*.mp3 2>/dev/null || true; git add sample/whole.mp3 sample/whole.json sample/photo.jpg sample/photo.json sample/logo-*.png 2>/dev/null || true
          git commit -m "Gemini voice sample audio" || exit 0
          for t in 1 2 3 4; do git push && break; sleep $((t * 5)); done
