# A one-off sample: the reel's narration read by the free Arabic voices, for the owner to listen to (2026-10-27).
name: Voice sample
on:
  push:
    branches: [voice-sample]
    paths: [sample/lines.txt]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - name: Read each line with each voice
        run: |
          set -euo pipefail
          for v in ar-EG-ShakirNeural ar-EG-SalmaNeural; do
            i=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              i=$((i+1))
              edge-tts --voice "$v" --rate=+8% --text "$line" --write-media "sample/$v-$i.mp3"
            done < sample/lines.txt
          done
          ls -la sample
      - name: Keep the audio on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample/*.mp3
          git commit -m "Voice sample audio"
          git push
