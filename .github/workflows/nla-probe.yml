# One-off (owner, 2026-11-12: the Leicester story reel): queue the special once the API is deployed. Never merged.
name: NLA probe
on:
  push:
    branches: [claude/nla-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          echo "::add-mask::$REELS_KEY"
          sleep 240
          curl -sS --max-time 120 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "special=leicester" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d.get('special'),indent=1)); print(list(d.keys())[:20])"
