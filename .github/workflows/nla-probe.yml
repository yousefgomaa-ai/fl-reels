# One-off (owner, 2026-11-11): queue the nlgroups special again once the API is deployed (logo, 19 sides, hiss fix).
# Lives on claude/nla-probe only; never merged.
name: NLA probe
on:
  push:
    branches: [claude/nla-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          echo "::add-mask::$REELS_KEY"
          A=https://api.football-legend.com
          sleep 330
          R=$(curl -sS --max-time 120 -w ' HTTP=%{http_code}' "$A/v2/fben/dry?key=$REELS_KEY&special=nlgroups&kinds=none" 2>&1 || true)
          echo "$R" | head -c 600; echo
