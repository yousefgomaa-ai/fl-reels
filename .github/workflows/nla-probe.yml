# One-off (owner, 2026-11-13: the four new kinds): queue the samples one at a time, a render apart, after the API's deploy.
# The API answers in about two minutes: a long timeout, and one failure does not stop the rest. Never merged.
name: NLA probe
on:
  push:
    branches: [claude/nla-probe]
    paths: [.github/workflows/nla-probe.yml]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        shell: bash
        run: |
          echo "::add-mask::$REELS_KEY"
          sleep 300
          for S in number-kane said-mourinho mirror-esposito next-pochettino; do
            curl -sS --max-time 400 -G "https://api.football-legend.com/v2/fben/dry" --data-urlencode "key=$REELS_KEY" --data-urlencode "kinds=none" --data-urlencode "special=$S" -o r.json || echo "$S: no answer"
            python3 -c "import json;d=json.load(open('r.json'));print('$S', json.dumps((d.get('result') or d).get('special')))" || head -c 300 r.json
            [ "$S" = next-pochettino ] || sleep 840
          done
