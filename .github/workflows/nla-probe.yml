# One-off (owner, 2026-11-12: the Leicester story reel): Commons candidates, thumbs committed back. Never merged.
name: NLA probe
on:
  push:
    branches: [claude/nla-probe]
    paths: [probe/commons.py, .github/workflows/nla-probe.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: claude/nla-probe }
      - run: python3 probe/commons.py
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe/th && git commit -qm "probe: Commons thumbs" && git push -q origin HEAD:claude/nla-probe
