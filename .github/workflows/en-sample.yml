# One-off (FB Legends samples, 2026-11-03): two weeks of results in the big five leagues and the Champions League,
# committed as sample/data.json for the new reels' samples. Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sample; echo '[]' > sample/data.json
          for i in $(seq 0 20); do d=$(date -u -d "$i days ago" +%Y%m%d)
            curl -sS --max-time 40 "https://api.football-legend.com/matches?date=$d" | jq -c '[.events[]? | select(.leagueSlug|test("^(eng\\.1|esp\\.1|ita\\.1|ger\\.1|fra\\.1|uefa\\.champions)$")) | {id, l:.leagueSlug, date:.fixture.date, st:.fixture.status.state, h:.teams.home.name, a:.teams.away.name, hl:.teams.home.logo, al:.teams.away.logo, hs:.goals.home, as:.goals.away}]' > d.json || echo '[]' > d.json
            jq -s '.[0] + .[1]' sample/data.json d.json > t.json && mv t.json sample/data.json; sleep 1; done
          jq length sample/data.json
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add sample/data.json && git commit -m "sample data [skip ci]" && git push
