# One-off live check after the FB Legends merge (2026-11-03): the API answers, and the English reels in the queue.
# Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          REELS_KEY_SECRET: ${{ secrets.REELS_KEY }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          sleep 90
          if [ -n "${REELS_KEY_SECRET:-}" ]; then key="$REELS_KEY_SECRET"; else key=$(printf 'fl-reels:%s' "$CF_API_TOKEN" | sha256sum | cut -c1-48); fi
          echo "::add-mask::$key"
          d=$(date -u +%Y%m%d)
          for u in "https://api.football-legend.com/matches?date=$d" "https://api.football-legend.com/v2/hero" "https://api.football-legend.com/standings?league=eng.1"; do
            curl -sS -o /dev/null --max-time 40 -w "%{http_code} %{time_total}s $u\n" "$u" || echo "fail $u"; done
          curl -sS --max-time 40 "https://api.football-legend.com/v2/reels/jobs?key=$key" | jq -r '.jobs[]? | "queued \(.id) anim=\(.anim.kind // "-")"' | head -30
          curl -sS --max-time 40 "https://api.football-legend.com/v2/reels/status?key=$key" | jq -r '.reels[]? | select((.id // "")|startswith("en-")) | tostring' | head -20
          echo done
