# One-off live check (FB Legends, 2026-11-03; run 2026-11-10: the Manchester facts from ESPN). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          E=https://site.api.espn.com/apis
          curl -sS "$E/v2/sports/soccer/eng.1/standings" | jq -r '.children[0].standings.entries[] | [(.stats[]|select(.name=="rank").value), .team.displayName, (.stats[]|select(.name=="gamesPlayed").value), (.stats[]|select(.name=="wins").value), (.stats[]|select(.name=="ties").value), (.stats[]|select(.name=="losses").value), (.stats[]|select(.name=="pointsFor").value), (.stats[]|select(.name=="pointsAgainst").value), (.stats[]|select(.name=="points").value), (.note.description // "")] | @tsv'
          for t in 360 382; do echo "== team $t"; curl -sS "$E/site/v2/sports/soccer/eng.1/teams/$t/schedule?season=2026" | jq -r '.events[] | select(.competitions[0].status.type.completed) | [.date[0:10], .competitions[0].competitors[0].team.displayName, (.competitions[0].competitors[0].score.displayValue // .competitions[0].competitors[0].score), .competitions[0].competitors[1].team.displayName, (.competitions[0].competitors[1].score.displayValue // .competitions[0].competitors[1].score)] | @tsv'; done
          for t in 360 382; do echo "== all comps $t"; curl -sS "$E/site/v2/sports/soccer/all/teams/$t/schedule?season=2026" | jq -r '.events[]? | select(.competitions[0].status.type.completed) | [.date[0:10], .league.abbreviation // .season.slug // "", .competitions[0].competitors[0].team.displayName, (.competitions[0].competitors[0].score.displayValue // ""), .competitions[0].competitors[1].team.displayName, (.competitions[0].competitors[1].score.displayValue // "")] | @tsv' | tail -12; done
