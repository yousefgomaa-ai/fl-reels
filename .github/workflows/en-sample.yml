# One-off live check (FB Legends, 2026-11-03; run 2026-11-06 morning). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"
          mkdir -p look
          curl -sS --max-time 120 -o look/cr7.mp4 "https://api.football-legend.com/reel.mp4?id=en-special-cr7-1&v=$(date +%s)"; ls -la look/cr7.mp4
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add look && git commit -qm "cr7 reel to look at" && git push -q origin HEAD:claude/en-sample || true
          echo done
