# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - env:
          REELS_KEY_SECRET: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY_SECRET"; echo "::add-mask::$key"; sleep 200
          curl -sS -o /dev/null --max-time 40 -w "%{http_code} api\n" "https://api.football-legend.com/v2/hero"
          curl -sS --max-time 40 "https://api.football-legend.com/v2/reels/status?key=$key" | jq -r '.reels[]? | select((.id // "")|startswith("en-")) | "\(.id) \(.status) tries=\(.tries) err=\(.error)"' | head -20
          curl -sS --max-time 40 "https://api.football-legend.com/v2/reels/jobs?key=$key" | jq -r '.jobs[]? | "queued \(.id) lines=\(.voiceLines|length)"' | head
