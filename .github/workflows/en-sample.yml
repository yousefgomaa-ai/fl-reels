# One-off live check (FB Legends, 2026-11-03; run 2026-11-10 checked numbers). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"
          sleep 150
          for at in 2026-11-11T19:00:00Z 2026-11-12T19:00:00Z 2026-11-13T19:00:00Z; do curl -sS --max-time 120 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=nateve&at=$at" | jq -c '{at:"'$at'", r:.result.nateve, j:[.jobs[]? | {id, title, n:(.anim.rows|length), rows:[.anim.rows[] | "\(.time) \(.home) v \(.away)"]}]}' | head -c 2500; echo; done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          true
          echo done
