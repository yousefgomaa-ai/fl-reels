# One-off live check (FB Legends, 2026-11-03; run 2026-11-05 fado). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"
          B="https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none"
          sleep 150; date -u
          curl -sS --max-time 120 "$B&special=cr7" | jq -c '.result.special // .' | head -c 400; echo
          mkdir -p look
          for i in $(seq 1 40); do sleep 30; s=$(curl -sS --max-time 60 "$B&state=en-special-cr7-1" | jq -r '.result.state.job.status // "?"'); echo "$i $s"; [ "$s" = ready ] && break; done
          curl -sS --max-time 120 -o look/cr7.mp4 "https://api.football-legend.com/reel.mp4?id=en-special-cr7-1"; ls -la look/cr7.mp4
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add look && git commit -qm "cr7 reel to look at" && git push -q origin HEAD:claude/en-sample || true
          echo done
