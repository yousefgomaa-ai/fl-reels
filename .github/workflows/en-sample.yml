# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for i in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; sleep 10; done
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          timeout 300 npx playwright install --with-deps chromium
      - run: |
          mkdir -p sample/look; UA="FootballLegendsBot/1.0 (https://football-legend.com/contact/)"
          curl -sSL -A "$UA" -o sample/look/h.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Erling_Haaland_2023_(fullcropped).jpg?width=480"
          curl -sSL -A "$UA" -o sample/look/m.png "https://commons.wikimedia.org/wiki/Special:FilePath/Kylian_Mbapp%C3%A9_against_M%C3%A1laga,_match_valid_for_the_third_round_of_La_Liga_on_August_30,_2026.png?width=480"
          ls -la sample/look
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add -A sample/look && git commit -m "look [skip ci]" && git push
