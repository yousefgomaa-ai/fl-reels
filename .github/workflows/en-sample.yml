# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for i in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; sleep 10; done
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          timeout 300 npx playwright install --with-deps chromium
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"; sleep 5
          A="https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none"
          sleep 5
          date -u; mkdir -p look; U='FootballLegendsBot/1.0 (https://football-legend.com/contact/)'
          curl -sS --max-time 60 "https://api.football-legend.com/v2/reels/status?key=$key" | jq -c '.reels[]? | select((.id // "") | test("^en-(special|pick)")) | {id, status, readyAt}'
          for c in Pedri Rodrygo Arda_Güler; do
            curl -sS -A "$U" "https://commons.wikimedia.org/w/api.php?action=query&format=json&generator=categorymembers&gcmtitle=Category:$c&gcmtype=file&gcmlimit=40&gcmsort=timestamp&gcmdir=desc&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=400" > "look/$c.json"
            jq -r '.query.pages[] | [.title, (.imageinfo[0].width|tostring), (.imageinfo[0].extmetadata.LicenseShortName.value // ""), ((.imageinfo[0].extmetadata.Artist.value // "") | gsub("<[^>]*>";"")), (.imageinfo[0].extmetadata.DateTimeOriginal.value // "" | .[0:10]), .imageinfo[0].thumburl] | @tsv' "look/$c.json" > "look/$c.tsv"
            i=0; while IFS=$'\t' read -r t w l a d u; do i=$((i+1)); [ $i -gt 14 ] && break; curl -sSL -A "$U" -o "look/${c}_$i.jpg" "$u"; echo "$c $i | $t | $w | $l | $a | $d"; done < "look/$c.tsv"
          done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add look && git commit -qm "look" && git push -q origin HEAD:claude/en-sample; echo done
