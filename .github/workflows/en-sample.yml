# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for i in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; sleep 10; done
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          timeout 300 npx playwright install --with-deps chromium
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"; sleep 5
          A="https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none"
          sleep 5
          date -u; mkdir -p look; U='FootballLegendsBot/1.0 (https://football-legend.com/contact/)'
          for f in RonaldoAl-Nassr23.jpg Cristiano_Ronaldo_in_2023.jpg Lionel_Messi_NYCFC_Miami_24_Sep_2025-050.jpg; do
            curl -sSL -A "$U" -o "look/$f" "https://commons.wikimedia.org/wiki/Special:FilePath/$f?width=640"
            curl -sS -A "$U" "https://commons.wikimedia.org/w/api.php?action=query&format=json&titles=File:$f&prop=imageinfo&iiprop=size|extmetadata" | jq -c '.query.pages[] | {t: .title, w: .imageinfo[0].width, h: .imageinfo[0].height, lic: .imageinfo[0].extmetadata.LicenseShortName.value, who: .imageinfo[0].extmetadata.Artist.value, d: .imageinfo[0].extmetadata.DateTimeOriginal.value}'
          done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add look && git commit -qm "look" && git push -q origin HEAD:claude/en-sample; echo done
