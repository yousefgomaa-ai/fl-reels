# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for i in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; sleep 10; done
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          timeout 300 npx playwright install --with-deps chromium
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"; sleep 20
          q() { curl -sS --max-time 200 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=$1&at=$2"; }
          : > all.json
          curl -sS --max-time 200 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=sched,preview&at=2026-11-04T15:00:00Z&list=1" | jq -c '{r: .result.sched, p: .result.preview, n: (.result.list|length)}'
          curl -sS --max-time 200 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=sched&at=2026-11-07T08:00:00Z&list=1" | jq -c '{r: .result.sched, list: .result.list[0:8]}'
          curl -sS --max-time 200 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=preview&at=2026-11-05T15:00:00Z" | jq -c '.result'
          curl -sS --max-time 200 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none&at=2026-11-08T12:00:00Z&list=1" | jq -c '{list: .result.list[0:12]}'
          for i in 1 2 3; do curl -sS --max-time 200 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=five&at=2026-11-06T13:00:00Z" | jq -c '.result'; sleep 65; done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          echo done-check
