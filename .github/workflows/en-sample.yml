# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for i in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; sleep 10; done
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          timeout 300 npx playwright install --with-deps chromium
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"; sleep 5
          B="https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none"
          date -u
          curl -sS --max-time 120 "$B&list=1" | jq -r '.result.list[]? | select(test(" uefa.europa"))'
          curl -sS --max-time 120 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=board" | jq -c '{r:.result.board, j:[.jobs[]? | {id, rows:(.anim.rows|length), title}]}'
          for id in en-board-uel-20261105 en-board-uecl-20261105; do curl -sS --max-time 60 "$B&state=$id" | jq -c '.result.state // .' | head -c 500; echo; done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          echo done
