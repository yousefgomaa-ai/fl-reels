# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for i in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; sleep 10; done
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          timeout 300 npx playwright install --with-deps chromium
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"; sleep 5
          A="https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none"
          sleep 5
          date -u
          curl -sS --max-time 120 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none&list=1" > out.json || true
          jq -r '.result.list[]? | select(contains("uefa"))' out.json | head -3
          curl -sS --max-time 60 "https://api.football-legend.com/v2/reels/status?key=$key" | jq -c '.reels[]? | select((.id // "") | test("^en-(ht|ft|res)")) | {id, status, at, readyAt}' | tail -5
          for j in en-ht-ucl-20261104-1745; do curl -sS --max-time 60 "$A&job=$j" | jq -c '.result.job'; done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          echo done
