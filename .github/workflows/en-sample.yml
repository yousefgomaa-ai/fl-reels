# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          mkdir -p look; python3 sample/crsearch.py
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add look && git commit -qm "ronaldo portugal photos" && git push -q origin HEAD:claude/en-sample || true
          echo done
