# One-off live check (FB Legends, 2026-11-03; run 2026-11-05 fado). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"
          for v in Charon Enceladus Fenrir; do curl -sS --max-time 150 -o v.out -w "$v %{http_code} %{size_download}\n" "https://api.football-legend.com/v2/reels/voice?key=$key&voice=$v&lang=en-GB&text=Twenty-three%20years.%20One%20shirt."; head -c 300 v.out | tr -d '\0' | grep -a error; sleep 5; done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          true
          echo done
