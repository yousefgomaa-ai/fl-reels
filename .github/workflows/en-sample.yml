# One-off live check (FB Legends, 2026-11-03; run 2026-11-10: facts for the United and City reels). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p look; E=https://site.api.espn.com/apis
          curl -sS --max-time 60 "$E/v2/sports/soccer/eng.1/standings" > look/table.json
          for t in 360 382; do
            curl -sS --max-time 60 "$E/site/v2/sports/soccer/eng.1/teams/$t/schedule" > look/s$t.json
            curl -sS --max-time 60 "$E/site/v2/sports/soccer/eng.1/teams/$t/schedule?fixture=true" > look/f$t.json
            curl -sS --max-time 60 "$E/site/v2/sports/soccer/eng.1/teams/$t" > look/t$t.json
          done
          ls -la look
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git rm -q --cached look/manchester.mp4 2>/dev/null; rm -f look/manchester.mp4
          git add -A look && git commit -qm "facts to look at" && git push -q origin HEAD:claude/en-sample || true
