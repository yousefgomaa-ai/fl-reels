# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          for i in 1 2 3; do timeout 240 sudo apt-get update -qq && timeout 240 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null && break; sleep 10; done
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          timeout 300 npx playwright install --with-deps chromium
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"; sleep 170
          : > all.json
          for x in "sched 2026-11-07T07:30:00Z" "sched 2026-11-08T07:30:00Z" "preview 2026-11-04T15:00:00Z" "preview 2026-11-05T15:00:00Z" "preview 2026-11-06T15:00:00Z" "five 2026-11-06T13:00:00Z"; do
            set -- $x; curl -sS --max-time 200 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=$1&at=$2" > d.json
            jq -c "{k: \"$1 $2\", r: .result, j: [.jobs[] | {id, title}]}" d.json || head -c 300 d.json; jq -c '.jobs[]' d.json >> all.json || true; sleep 40
          done
          jq -s '[group_by(.enKind)[] | .[0] | {id: (.id + "-s"), anim, voiceText, voiceName: "Fenrir", voiceLang: "en-GB", voiceStyle: "", caption, title}]' all.json > sample/jobs.json
          jq -r '.[] | "== \(.id)\n\(.caption)"' sample/jobs.json
          mkdir -p sample/out && node sample/render.mjs sample/jobs.json sample/out
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add -A sample/out && git commit -m "sample output [skip ci]" && git push || true
