# One-off (FB Legends, owner 2026-11-03: «صوت حماسي رايق يليق بالأوروبيين»): English voice samples from the site's
# voice endpoint, committed to this branch for the owner to choose. Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY_SECRET: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY_SECRET"; echo "::add-mask::$key"
          mkdir -p sample/voice
          TEXT="Full time in the Champions League! Paris Saint-Germain run riot in Villarreal, four goals and counting. Who was your man of the match? Tell us in the comments."
          STYLE="Speak as an energetic but composed British football commentator: warm, confident and upbeat, never shouting, a clear British English accent, natural pace."
          for v in Fenrir Puck Orus Algieba Charon; do
            for i in 1 2 3; do
              code=$(curl -sS -G --max-time 120 -o sample/voice/$v.wav -w "%{http_code}" "https://api.football-legend.com/v2/reels/voice" \
                --data-urlencode "key=$key" --data-urlencode "text=$TEXT" --data-urlencode "voice=$v" --data-urlencode "style=$STYLE" --data-urlencode "lang=en-GB")
              echo "$v try $i: $code $(stat -c %s sample/voice/$v.wav)"; [ "$code" = 200 ] && break; rm -f sample/voice/$v.wav; sleep 25
            done
            sleep 15
          done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add -A sample/voice && git commit -m "voice samples [skip ci]" && git push
