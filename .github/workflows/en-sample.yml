# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - env:
          REELS_KEY_SECRET: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY_SECRET"; echo "::add-mask::$key"; sleep 240
          for at in 2026-11-04T19:00:00Z 2026-11-05T19:00:00Z; do curl -sS --max-time 120 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=compare&at=$at&list=1" | jq -c "{at: \"$at\", r: .result, jobs: [.jobs[]? | {id, title, a: .anim.a, b: .anim.b}]}"; done
