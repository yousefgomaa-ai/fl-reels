# One-off live check (FB Legends, 2026-11-03; run 2026-11-10: stadium photos for the Manchester reel). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p look; UA='FootballLegendsReels/1.0 (https://football-legend.com)'
          i=0
          for q in "Old Trafford stadium" "Old Trafford exterior" "Etihad Stadium Manchester" "City of Manchester Stadium exterior"; do
            curl -sS -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&format=json&generator=search&gsrnamespace=6&gsrlimit=6&gsrsearch=$(jq -rn --arg q "$q" '$q|@uri')&prop=imageinfo&iiprop=url|extmetadata|size&iiurlwidth=500" \
            | jq -r '.query.pages[]? | [.title, .imageinfo[0].thumburl, (.imageinfo[0].extmetadata.LicenseShortName.value // ""), (.imageinfo[0].extmetadata.Artist.value // "" | gsub("<[^>]*>";"")), .imageinfo[0].width, .imageinfo[0].height] | @tsv' > /tmp/r.tsv
            while IFS=$'\t' read -r t u l a w h; do i=$((i+1)); echo "$i	$t	$l	$a	${w}x$h" >> look/list.tsv; curl -sS -A "$UA" -o "look/$i.jpg" "$u"; sleep 1; done < /tmp/r.tsv
          done
          cat look/list.tsv
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add look && git commit -qm "stadiums to look at" && git push -q origin HEAD:claude/en-sample || true
