# One-off live check (FB Legends, 2026-11-03; run 2026-11-10 checked numbers). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"
          B="https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none"
          T=$(date -u -d tomorrow +%Y-%m-%dT15:00:00Z); D2=$(date -u -d "+2 day" +%Y-%m-%dT15:00:00Z)
          for at in $T $D2; do curl -sS --max-time 120 "$B&upcoming=1&at=$at" | jq -c '.result.upcoming' | head -c 1500; echo; done
          curl -sS --max-time 120 "https://api.football-legend.com/v2/fben/dry?key=$key&kinds=round" | jq -c '{r:.result.round, j:[.jobs[]? | {id, n:(.anim.rows // .anim.matches // [] | length), title}]}' | head -c 1500; echo
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          true
          echo done
