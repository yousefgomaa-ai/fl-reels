# One-off live check (FB Legends, 2026-11-03; run 2026-11-06 morning). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"
          B="https://api.football-legend.com/v2/fben/dry?key=$key&kinds=none"
          for id in en-special-verdict-1 en-special-cr7-1; do curl -sS --max-time 60 "$B&state=$id" | jq -c '.result.state // .' | head -c 700; echo; done
      - run: |
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          true
          echo done
