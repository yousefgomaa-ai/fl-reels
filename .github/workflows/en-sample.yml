# One-off (FB Legends sample, 2026-11-03): the Champions League top scorers as the site serves them, committed as
# sample/ucl.json. Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sample && curl -sS --max-time 40 "https://api.football-legend.com/ucl/scorers" > sample/ucl.json; head -c 600 sample/ucl.json
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add sample/ucl.json && git commit -m "sample data [skip ci]" && git push
