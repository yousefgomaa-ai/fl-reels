# One-off live check (2026-11-10): whisper over the United and City reels' voice. Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get -qq install -y ffmpeg >/dev/null; pip -q install faster-whisper
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          m = WhisperModel('medium.en', device='cpu', compute_type='int8')
          for n in ('united', 'city'):
              segs, _ = m.transcribe(f'look/{n}.mp4', language='en')
              print('==', n)
              for s in segs: print(f'{s.start:5.1f}-{s.end:5.1f} {s.text}')
          PY
