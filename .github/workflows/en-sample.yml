# One-off live check (FB Legends, 2026-11-03). Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - env:
          REELS_KEY_SECRET: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY_SECRET"; echo "::add-mask::$key"; d=$(date -u +%Y%m%d)
          for u in "https://api.football-legend.com/matches?date=$d" "https://api.football-legend.com/v2/hero"; do curl -sS -o /dev/null --max-time 40 -w "%{http_code} %{time_total}s $u\n" "$u" || echo "fail $u"; done
          curl -sS --max-time 40 "https://api.football-legend.com/matches?date=$d" | jq -r '.events[]? | select(.leagueSlug=="uefa.champions") | "\(.fixture.status.state) clock=\(.fixture.status.clock) detail=\(.fixture.status.detail) \(.teams.home.name) \(.goals.home)-\(.goals.away) \(.teams.away.name)"'
          curl -sS --max-time 40 "https://api.football-legend.com/v2/reels/status?key=$key" | jq -r '.reels[]? | select((.id // "")|startswith("en-")) | "\(.id) \(.status) tries=\(.tries) err=\(.error)"' | head
          curl -sS --max-time 40 "https://api.football-legend.com/v2/reels/jobs?key=$key" | jq -r '.jobs[]? | "queued \(.id)"' | head
