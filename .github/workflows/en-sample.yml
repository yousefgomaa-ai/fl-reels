# One-off (FB Legends, 2026-11-03): the English planners' dry run on the live server at several times, committed as
# sample/dry/*.json for review. Lives on claude/en-sample only; never merged.
name: EN sample
on:
  push:
    branches: [claude/en-sample]
permissions:
  contents: write
jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          REELS_KEY_SECRET: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY_SECRET"; echo "::add-mask::$key"; sleep 120; mkdir -p sample/dry
          A="https://api.football-legend.com/v2/fben/dry?key=$key"
          get() { curl -sS --max-time 120 "$A&at=$1&kinds=$2$3" > "sample/dry/$4.json"; echo "$4: $(jq -c .result sample/dry/$4.json 2>/dev/null || head -c 200 sample/dry/$4.json)"; sleep 3; }
          get 2026-11-04T10:30:00Z today,predict "" wed-morning
          get 2026-11-04T16:30:00Z streak "" wed-afternoon
          get 2026-11-03T10:00:00Z weekend "" tue-morning
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add -A sample/dry && git commit -m "dry run [skip ci]" && git push
