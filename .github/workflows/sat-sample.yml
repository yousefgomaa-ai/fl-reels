# Satisfying sample (owner, 2026-11-18): six impossible cuts made by Wan 2.2 on Kaggle's free T4s, edited here. Never merge.
name: Satisfying sample
on:
  push:
    branches: [claude/series-sample]
    paths: [sat/sample.json, sat/kaggle.py, sat/assemble.py, .github/workflows/sat-sample.yml]
permissions:
  contents: write
concurrency: { group: sat-sample, cancel-in-progress: false }
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - run: git config user.name "series-sample" && git config user.email "actions@users.noreply.github.com"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
      - run: pip install -q "kaggle>=1.8" pillow numpy scipy
      - name: Kaggle (Wan 2.2 clips)
        run: |
          if [ -f sat/out/log.json ]; then echo "already made"; exit 0; fi
          mkdir -p /tmp/k && sed "s/EP_SHA/$GITHUB_SHA/" sat/kaggle.py > /tmp/k/kaggle.py && cd /tmp/k
          cat > kernel-metadata.json <<J
          {"id": "$KAGGLE_USERNAME/satisfying-sample", "title": "satisfying-sample", "code_file": "kaggle.py",
           "language": "python", "kernel_type": "script", "is_private": true,
           "enable_gpu": true, "enable_internet": true}
          J
          kaggle kernels push -p .
          sleep 120
          for i in $(seq 1 120); do
            s=$(kaggle kernels status "$KAGGLE_USERNAME/satisfying-sample" 2>&1 | tail -1); echo "$(date -u +%H:%M) $s"
            case "$s" in *COMPLETE*|*ERROR*|*CANCEL*) break;; esac
            sleep 60
          done
          cd $GITHUB_WORKSPACE && mkdir -p sat/out && kaggle kernels output "$KAGGLE_USERNAME/satisfying-sample" -p sat/out
          tail -c 3000 sat/out/*.log || true; rm -f sat/out/*.log
          cat sat/out/log.json; ls -R sat/out
          git add sat/out && git commit -m "Satisfying sample: Kaggle clips [skip ci]" && git pull -q --rebase origin claude/series-sample && git push
      - run: python3 sat/assemble.py
      - run: |
          git add sat/satisfying_sample.mp4 && git commit -m "Satisfying sample: video [skip ci]" && git pull -q --rebase origin claude/series-sample && git push
