# One-off check (owner, 2026-11-11: «تاكد من الماتشات كلها لحد اخر الشهر»): our day lists against ESPN. Lives on claude/nl-probe only; never merged.
name: NL probe
on:
  push:
    branches: [claude/nl-probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf look; mkdir -p look
          python3 sample/check.py | tee look/report.txt
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add -A look && git commit -qm "fixtures check to look at" && git push -q origin HEAD:claude/nl-probe || true
