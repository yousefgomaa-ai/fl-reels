# One-off look (2026-11-10): what the English page's planners would make on Wednesday 11 November. Lives on claude/nl-probe only; never merged.
name: NL probe
on:
  push:
    branches: [claude/nl-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"
          sleep 300; for h in 11 15 17 19; do
            echo "== $h:30 UTC"
            curl -sS --max-time 240 "https://api.football-legend.com/v2/fben/dry?key=$key&at=2026-11-11T$h:30:00Z" | jq -r '.jobs[]? | "\(.kind) | \(.id) | \(.title)"' | sort -u
          done
          echo "== queued now"
          curl -sS --max-time 60 "https://api.football-legend.com/v2/reels/jobs?key=$key" | jq -r '.jobs[]? | "\(.id) | \(.status // "")"'
