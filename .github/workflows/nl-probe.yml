# One-off live check (2026-11-10): the captions queue and its errors. Lives on claude/nl-probe only; never merged.
name: NL probe
on:
  push:
    branches: [claude/nl-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          key="$REELS_KEY"; echo "::add-mask::$key"
          sleep 5
          curl -sS --max-time 120 "https://api.football-legend.com/v2/fben/ccq?key=$key&n=2" | jq -c '.queue[0:2]'
