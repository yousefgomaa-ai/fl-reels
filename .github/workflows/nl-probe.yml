# One-off check (owner, 2026-11-11: «بعد ما يتعمل تاكد من المواعيد اللي في الجدول»): the Nations League eve schedule's
# times against ESPN's own list. Lives on claude/nl-probe only; never merged.
name: NL probe
on:
  push:
    branches: [claude/nl-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - env:
          REELS_KEY: ${{ secrets.REELS_KEY }}
        run: |
          echo "::add-mask::$REELS_KEY"
          A=https://api.football-legend.com
          echo "== job state"; curl -sS "$A/v2/fben/dry?key=$REELS_KEY&state=en-nateve-uefanations-20261112&kinds=none" | jq -c "del(.jobs)"
