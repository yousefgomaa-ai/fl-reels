# One-off look (2026-11-10): the Champions League games left in November. Lives on claude/nl-probe only; never merged.
name: NL probe
on:
  push:
    branches: [claude/nl-probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf look; mkdir -p look; E=https://site.api.espn.com/apis
          for d in $(seq 11 30); do curl -sS --compressed --max-time 60 "$E/site/v2/sports/soccer/uefa.champions/scoreboard?dates=202611$d&limit=100" > look/u$d.json; done
          ls -la look
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add -A look && git commit -qm "ucl to look at" && git push -q origin HEAD:claude/nl-probe || true
