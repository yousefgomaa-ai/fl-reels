# One-off trial (owner, 2026-11-17): Piper, a free voice that runs on the runner, reading Arabic lines, to compare with
# Gemini's voice. Nothing here calls Gemini or the site.
name: Piper voice trial
on:
  push:
    branches: [piper-sample]
    paths: [piper/lines.txt, .github/workflows/piper.yml]
permissions:
  contents: write
jobs:
  piper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          pip install -q piper-tts
      - name: Read each line with the Arabic voices
        run: |
          set -uo pipefail
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/ar/ar_JO/kareem
          for q in low medium; do
            curl -sSL -o "v-$q.onnx" "$base/$q/ar_JO-kareem-$q.onnx" && curl -sSL -o "v-$q.onnx.json" "$base/$q/ar_JO-kareem-$q.onnx.json" || continue
            ls -la "v-$q.onnx"
            python3 -m piper -m "v-$q.onnx" -f "piper/all-$q.wav" < piper/lines.txt && ffmpeg -loglevel error -y -i "piper/all-$q.wav" -b:a 128k "piper/kareem-$q.mp3"
            rm -f "piper/all-$q.wav"
          done
          ls -la piper
      - name: Keep the audio on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piper/*.mp3 && git commit -m "Piper voice trial audio" || exit 0
          for t in 1 2 3; do git push && break; sleep $((t * 5)); done
