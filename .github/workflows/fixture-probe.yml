# One-off check (2026-11-11): Egypt v Malawi after the dates fix. Lives on claude/fixture-probe only; never merged.
name: Fixture probe
on:
  push:
    branches: [claude/fixture-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          A=https://api.football-legend.com
          for d in 20261111 20261113 20261115 20261117; do
            echo "== $d"
            curl -sS --max-time 60 "$A/matches?date=$d" | jq -c '[.. | objects | select(has("fixture") and has("teams")) | select(.leagueSlug=="caf.nations_qual") | {id, d:.fixture.date, h:.teams.home.name, a:.teams.away.name}] | (length), (map(select(.h|test("Egypt|Malawi"))))'
          done
