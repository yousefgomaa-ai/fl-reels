# One-off check (owner, 2026-11-11: «تاكد من الماتشات كلها لحد اخر الشهر»): our day lists against ESPN. Lives on claude/fixture-probe only; never merged.
name: Fixture probe
on:
  push:
    branches: [claude/fixture-probe]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf look; mkdir -p look
          python3 sample/check.py > look/report.txt 2>&1 || true
          git config user.name "fl-reels sample" && git config user.email "actions@users.noreply.github.com"
          git add -A look && git commit -qm "fixtures report" && git push -q origin HEAD:claude/fixture-probe || true
