# One-off test (owner, 2026-11-12): run series/kaggle/run.py on Kaggle's free GPU and bring the shots back. Never merge.
name: Series Kaggle test
on:
  push:
    branches: [claude/series-sample]
    paths: [series/kaggle/run.py, .github/workflows/series-kaggle.yml]
permissions:
  contents: write
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "kaggle>=1.8"
      - name: Push the kernel
        run: |
          cd series/kaggle
          cat > kernel-metadata.json <<J
          {"id": "$KAGGLE_USERNAME/series-shot-test", "title": "series-shot-test", "code_file": "run.py",
           "language": "python", "kernel_type": "script", "is_private": true,
           "enable_gpu": true, "enable_internet": true}
          J
          kaggle kernels push -p .
      - name: Wait for it
        run: |
          for i in $(seq 1 180); do
            s=$(kaggle kernels status "$KAGGLE_USERNAME/series-shot-test" 2>&1 | tail -1); echo "$(date -u +%H:%M) $s"
            case "$s" in *COMPLETE*|*ERROR*|*CANCEL*) break;; esac
            sleep 60
          done
      - name: Bring the shots back
        if: always()
        run: |
          mkdir -p series/shots && kaggle kernels output "$KAGGLE_USERNAME/series-shot-test" -p series/shots || true
          ls -la series/shots; cat series/shots/log.json || tail -c 4000 series/shots/*.log || true
          rm -f series/shots/*.log
          git config user.name "series-sample" && git config user.email "actions@users.noreply.github.com"
          git add series/shots && git commit -m "Series sample: Kaggle shots [skip ci]" && git push || true
