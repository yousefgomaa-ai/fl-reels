# One-off: removes the test release of the long videos (this file is deleted in the next commit).
name: YouTube long video test cleanup
on:
  push:
    branches: [youtube-auto]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete ytv-test-round-1 --yes --cleanup-tag --repo ${{ github.repository }}
